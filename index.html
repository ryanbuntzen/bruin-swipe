<style>
:root{
  --paper:#e9edf2;
  --card:#ffffff;
  --card-2:#f4f7fa;
  --ink:#14202c;
  --ink-2:#556879;
  --ink-3:#8496a5;
  --line:#d3dde6;
  --line-soft:#e4ebf1;
  --accent:#9a5c0a;
  --accent-soft:#f7ead6;
  --blue:#1f5379;
  --flag:#9c3226;
  --flag-soft:#f7e2de;
  --ok:#2c6249;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e151d;
    --card:#161f29;
    --card-2:#1c2733;
    --ink:#e7edf3;
    --ink-2:#9dafbd;
    --ink-3:#71838f;
    --line:#2a3743;
    --line-soft:#212d38;
    --accent:#e5a75a;
    --accent-soft:#3a2c17;
    --blue:#7db3d8;
    --flag:#e08a7c;
    --flag-soft:#37211d;
    --ok:#74bb9b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e151d;
  --card:#161f29;
  --card-2:#1c2733;
  --ink:#e7edf3;
  --ink-2:#9dafbd;
  --ink-3:#71838f;
  --line:#2a3743;
  --line-soft:#212d38;
  --accent:#e5a75a;
  --accent-soft:#3a2c17;
  --blue:#7db3d8;
  --flag:#e08a7c;
  --flag-soft:#37211d;
  --ok:#74bb9b;
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
}
.wrap{max-width:580px;margin:0 auto;padding:18px 14px 150px;display:flex;flex-direction:column;gap:14px}

h1{
  font-family:"Barlow Condensed",Impact,sans-serif;
  font-weight:700;font-size:38px;line-height:.95;margin:0;
  text-transform:uppercase;text-wrap:balance;
}
h1 span{color:var(--accent)}
/* hall switcher */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);
  border:1px solid var(--line);padding:4px;border-radius:3px}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.045em;text-transform:uppercase;color:var(--ink-2);
  padding:8px 3px;border-radius:2px;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.tab .w{font-family:"IBM Plex Sans",sans-serif;font-size:10px;letter-spacing:.03em;
  text-transform:none;color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.tab[aria-selected="true"] .w{color:var(--card);opacity:.7}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* hall header */
.hallhead{border-bottom:2px solid var(--ink);padding-bottom:7px}
.hallhead h2{
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;margin:0;
  text-transform:uppercase;letter-spacing:.02em;line-height:1;
}
.hallnote{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;letter-spacing:.02em;padding:2px 8px;border-radius:2px;
  border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
.chip.bad{border-color:var(--flag);color:var(--flag)}

/* meal */
.meal{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.meal > header{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:9px 12px 8px;border-bottom:1px solid var(--line-soft);background:var(--card-2);
}
.meal h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.station{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.mealkcal{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;
  font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;line-height:1}
.mealkcal small{display:block;text-align:right;font-size:10.5px;font-weight:600;
  letter-spacing:.07em;color:var(--ink-3);text-transform:uppercase;margin-top:2px}

ul.items{list-style:none;margin:0;padding:0}
ul.items li{border-top:1px solid var(--line-soft)}
ul.items li:first-child{border-top:0}
.row{
  width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;
  padding:10px 12px;background:transparent;border:0;text-align:left;cursor:pointer;
  color:inherit;font:inherit;
}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nm{font-size:15px;font-weight:500;line-height:1.28}
.eye{
  display:block;font-size:12.5px;color:var(--blue);margin-top:2px;line-height:1.35;
}
.meta{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.meta .canola{color:var(--flag);background:var(--flag-soft);border-radius:2px;
  padding:0 4px;margin-left:2px;font-size:10px}
.kc{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;text-align:right;line-height:1.2}
.kc em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);
  font-family:"IBM Plex Sans",sans-serif;margin-top:1px}
li.pick .row{background:var(--accent-soft)}
li.pick .nm{color:var(--accent)}
li.pick .eye{color:var(--ink-2)}
.row[data-done="1"] .nm,.row[data-done="1"] .eye{text-decoration:line-through}
.row[data-done="1"]{opacity:.4}
.upcard{border-style:dashed}
.upcard > header{background:transparent}

/* sticky tally */
.total{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper)}
.total .inner{max-width:580px;margin:0 auto;padding:9px 16px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.total .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;
  line-height:1;font-variant-numeric:tabular-nums}
.total .big small{font-size:11.5px;font-weight:600;letter-spacing:.1em;opacity:.6;margin-left:5px}
.tallylbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.macros{display:flex;gap:12px;font-variant-numeric:tabular-nums}
.macros div{text-align:right}
.macros .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1}
.macros .l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;opacity:.6;margin-top:2px}
.bar{height:3px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.reset{appearance:none;background:transparent;border:1px solid rgba(255,255,255,.28);
  color:inherit;font:inherit;font-size:11px;padding:2px 8px;border-radius:2px;cursor:pointer;margin-top:4px}
.reset:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* profile + setup */
.who{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font:inherit;font-size:12px;padding:3px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.who:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:24px 14px;overflow:auto;z-index:10}
.sheet[hidden]{display:none}
.card2{background:var(--card);border:1px solid var(--line);border-radius:3px;
  width:100%;max-width:430px;padding:16px}
.card2 h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;margin:0 0 3px;
  text-transform:uppercase;letter-spacing:.03em}
.card2 p.sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:15px;padding:7px 9px;border-radius:2px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink)}
.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.diets{display:flex;flex-wrap:wrap;gap:6px}
.diets label{display:inline-flex;align-items:center;gap:5px;font-size:13px;text-transform:none;
  letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:2px;
  padding:5px 9px;cursor:pointer;margin:0}
.diets input{width:auto;margin:0}
.btns{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px}
.btn{appearance:none;font:inherit;font-size:14px;padding:8px 16px;border-radius:2px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.people button{appearance:none;font:inherit;font-size:13px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:2px}
.people button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
li.off{display:none}
.hid{font-size:11.5px;color:var(--ink-3);padding:8px 12px;border-top:1px solid var(--line-soft)}
</style>

</head>

<div class="wrap">
  <header class="head">
    <h1>Bruin <span>Swipe</span> Card</h1>
    <button class="who" id="who" type="button"></button>
  </header>

  <div class="tabs" role="tablist" aria-label="Dining hall"></div>

  <div class="hallhead">
    <h2 id="hallName"></h2>
    <div class="hallnote" id="hallNote"></div>
  </div>

  <div id="meals" style="display:flex;flex-direction:column;gap:12px"></div>


</div>

<div class="sheet" id="setup" hidden>
  <div class="card2" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Who's eating?</h2>
    <p class="sub">Saved on this device only. Nothing leaves your browser.</p>
    <div class="people" id="people"></div>
    <div class="fld">
      <label for="fName">Name</label>
      <input id="fName" type="text" autocomplete="off" placeholder="Ryan">
    </div>
    <div class="fld">
      <label for="fGoal">Daily calorie target</label>
      <input id="fGoal" type="number" inputmode="numeric" min="800" max="8000" step="50" placeholder="2400">
    </div>
    <div class="fld">
      <label>Diet</label>
      <div class="diets" id="fDiets"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="setupDel" type="button">Delete</button>
      <button class="btn" id="setupSave" type="button">Save</button>
    </div>
  </div>
</div>

<div class="bar" style="position:fixed;left:0;right:0;bottom:74px;z-index:2"><i id="barFill"></i><b id="barMark"></b></div>
<div class="total">
  <div class="inner">
    <div>
      <div class="tallylbl">Ticked today</div>
      <div class="big"><span id="tKcal">0</span><small>/ <span id="tGoal">2,400</span> KCAL</small></div>
      <button class="reset" id="reset" type="button">Clear</button>
    </div>
    <div class="macros">
      <div><div class="v" id="tP">0g</div><div class="l">Protein</div></div>
      <div><div class="v" id="tF">0g</div><div class="l">Fat</div></div>
      <div><div class="v" id="tC">0g</div><div class="l">Carb</div></div>
    </div>
  </div>
</div>

      ["PICK: red meat of the day","two palms · ~7oz · e.g. 5 pork riblets","pork riblets, tonjiru, Chinese sausage",480,36,30,15,0,1],
      ["Sticky Rice","3 scoops ≈ 1½ cups","Rice well · daily",305,6,0,67,0,0],
      ["Fuji Apple","1 medium","Fruit",102,0,0,24,0,0],
      ["Banana","1 medium","Fruit",126,2,0,32,0,0]
    ]}
  ]},
{ key:"Rendez", w:"same daily", name:"Rendezvous",
  note:['no breakfast','same menu daily','sticky rice'],
  meals:[
    { m:"Lunch", s:"Chinese Freestyle Bowl", kcal:1020, p:57, items:[
      ["Sticky Rice (base)","ask for a double base ≈ 2½ cups","Base pick",508,10,0,111,0,0],
      ["BBQ Roast Pork","1 spoodle ≈ 3oz","Entrée 1 · no seed oil",165,16,10,2,0,0],
      ["Beef & Broccoli","1 spoodle, take the beef","Entrée 2",110,9,5,9,0,0],
      ["Chocolate Milk","1 glass","Beverages · 8oz",171,10,2,27,0,0],
      ["Greek Yogurt","1 ladle ≈ ½ cup — if the bar is out","4oz",67,12,0,4,0,0]
    ]},
    { m:"Dinner", s:"Chinese Freestyle Bowl · same menu", kcal:1020, p:57, items:[
      ["Sticky Rice (base)","ask for a double base ≈ 2½ cups","Base pick",508,10,0,111,0,0],
      ["BBQ Roast Pork","1 spoodle ≈ 3oz","Entrée 1 · no seed oil",165,16,10,2,0,0],
      ["Beef & Broccoli","1 spoodle, take the beef","Entrée 2",110,9,5,9,0,0],
      ["Chocolate Milk","1 glass","Beverages · 8oz",171,10,2,27,0,0],
      ["Greek Yogurt","1 ladle ≈ ½ cup","4oz",67,12,0,4,0,0]
    ]}
  ]}
];

var UPSIZE = [
  ["White rice","2 scoops ≈ 1 cup","",205,4,0,44,0,0],
  ["Chocolate Milk","1 glass","",171,10,2,27,0,0],
  ["Banana","1 medium","",126,2,0,32,0,0],
  ["Greek Yogurt","1 ladle ≈ ½ cup","",67,12,0,4,0,0]
];

var tabsEl = document.querySelector(".tabs");
var mealsEl = document.getElementById("meals");
var active = 0, done = {}, people = {}, who = null;

// Diets are derived from the item text rather than hand-tagged on 250 rows.
// "PICK: red meat of the day" rotates between tri-tip, pork and lamb, so it is
// tagged redmeat (always true) but never pork (only some days) -- see NOTE below.
var DIETS = [
  { k:"veg",     label:"Vegetarian",
    re:/sausage|bacon|pork|beef|burger|steak|lamb|tri-?tip|riblet|rib\b|gyro|meatball|red meat|hayashi|tonjiru|turkey|chicken|fish|shrimp|salmon|tuna/ },
  { k:"nopork",  label:"No pork",
    re:/pork|riblet|rib\b|ribs|tonjiru|bacon|ham\b|chinese sausage/, no:/turkey bacon|turkey/ },
  { k:"nored",   label:"No red meat",
    re:/pork|beef|lamb|tri-?tip|steak|burger|gyro|meatball|riblet|rib\b|red meat|hayashi|tonjiru/ },
  { k:"nodairy", label:"No dairy",
    re:/milk|cheese|yogurt|cottage|parmesan/ }
];

function load(){
  try { people = JSON.parse(localStorage.getItem("swipe:people") || "{}"); } catch (e) { people = {}; }
  who = null;
  try { who = localStorage.getItem("swipe:who"); } catch (e) {}
  if (who && !people[who]) who = null;
  if (!who) { var names = Object.keys(people); who = names.length ? names[0] : null; }
  done = {};
  if (who) { try { done = JSON.parse(localStorage.getItem("swipe:done:" + who) || "{}"); } catch (e) { done = {}; } }
}
function save(){
  if (!who) return;
  try {
    localStorage.setItem("swipe:done:" + who, JSON.stringify(done));
    localStorage.setItem("swipe:people", JSON.stringify(people));
    localStorage.setItem("swipe:who", who);
  } catch (e) {}
}
function me(){ return people[who] || { goal:2400, diets:[] }; }

// carry over the single-user ticks from before profiles existed
function migrate(){
  var old = null;
  try { old = localStorage.getItem("swipecard2"); } catch (e) {}
  if (!old || Object.keys(people).length) return;
  people["Me"] = { goal:2400, diets:[] };
  who = "Me";
  try { done = JSON.parse(old) || {}; } catch (e) { done = {}; }
  save();
  try { localStorage.removeItem("swipecard2"); } catch (e) {}
}

// true when this item is off the current diet
function blocked(it){
  var d = me().diets || [];
  if (!d.length) return false;
  var txt = (it[0] + " " + (it[2] || "")).toLowerCase();
  for (var i = 0; i < DIETS.length; i++) {
    var D = DIETS[i];
    if (d.indexOf(D.k) > -1 && D.re.test(txt) && !(D.no && D.no.test(txt))) return true;
  }
  return false;
}

HALLS.forEach(function(h, i){
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role","tab");
  b.innerHTML = h.key + '<span class="w">' + h.w + '</span>';
  b.addEventListener("click", function(){ active = i; render(); window.scrollTo(0,0); });
  tabsEl.appendChild(b);
});

function tally(){
  var k=0,p=0,f=0,c=0;
  HALLS.forEach(function(h){
    h.meals.concat([{ items:UPSIZE, id:"up" }]).forEach(function(m, mi){
      m.items.forEach(function(it, ii){
        if (done[h.key + "-" + (m.id || mi) + "-" + ii] && !blocked(it)) { k+=it[3]; p+=it[4]; f+=it[5]; c+=it[6]; }
      });
    });
  });
  document.getElementById("tKcal").textContent = k.toLocaleString();
  document.getElementById("tP").textContent = Math.round(p) + "g";
  document.getElementById("tF").textContent = Math.round(f) + "g";
  document.getElementById("tC").textContent = Math.round(c) + "g";
  var goal = me().goal || 2400;
  document.getElementById("tGoal").textContent = goal.toLocaleString();
  document.getElementById("barFill").style.width = Math.min(100, k / goal * 100) + "%";
  document.getElementById("barMark").style.left = "100%";
}

function buildMeal(hallKey, mi, meal){
  var sec = document.createElement("section");
  sec.className = "meal";
  var mk = 0, mp = 0, hidden = 0;
  meal.items.forEach(function(it){
    if (blocked(it)) { hidden++; return; }
    mk += it[3]; mp += it[4];
  });
  var head = document.createElement("header");
  head.innerHTML =
    '<div><h3>' + meal.m + '</h3><div class="station">' + meal.s + '</div></div>' +
    '<div class="mealkcal">' + mk.toLocaleString() + '<small>kcal · ' + mp + 'g P</small></div>';
  sec.appendChild(head);

  var ul = document.createElement("ul");
  ul.className = "items";
  meal.items.forEach(function(it, ii){
    var id = hallKey + "-" + mi + "-" + ii;
    var li = document.createElement("li");
    if (it[8]) li.className = "pick";
    if (blocked(it)) { li.className += " off"; ul.appendChild(li); return; }
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "row";
    btn.dataset.done = done[id] ? "1" : "0";
    btn.setAttribute("aria-pressed", done[id] ? "true" : "false");
    btn.innerHTML =
      '<span><span class="nm">' + it[0] + '</span>' +
        '<span class="eye">' + it[1] + '</span>' +
        (it[2] ? '<span class="meta">' + it[2] + (it[7] ? '<span class="canola">canola</span>' : '') + '</span>' : '') +
      '</span>' +
      '<span class="kc">' + it[3] + '<em>P' + it[4] + ' F' + it[5] + ' C' + it[6] + '</em></span>';
    btn.addEventListener("click", function(){
      done[id] = !done[id];
      btn.dataset.done = done[id] ? "1" : "0";
      btn.setAttribute("aria-pressed", done[id] ? "true" : "false");
      save(); tally();
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  if (hidden) {
    var n = document.createElement("div");
    n.className = "hid";
    n.textContent = hidden + (hidden === 1 ? " item" : " items") + " hidden by your diet";
    sec.appendChild(n);
  }
  return sec;
}

function render(){
  var h = HALLS[active];
  Array.prototype.forEach.call(tabsEl.children, function(b, i){
    b.setAttribute("aria-selected", i === active ? "true" : "false");
  });
  document.getElementById("hallName").textContent = h.name;
  document.getElementById("hallNote").innerHTML = h.note.map(function(n){
    var bad = /^no |rotates/.test(n);
    return '<span class="chip' + (bad ? ' bad' : '') + '">' + n + '</span>';
  }).join("");

  var d = me().diets || [];
  document.getElementById("who").textContent =
    (who || "Set up") + (d.length ? " \u00b7 " + d.length + " filter" + (d.length > 1 ? "s" : "") : "");

  mealsEl.textContent = "";
  h.meals.forEach(function(meal, mi){
    mealsEl.appendChild(buildMeal(h.key, mi, meal));
  });
  var up = buildMeal(h.key, "up", { m:"Weekend +", s:"add to each of your 2 meals", items:UPSIZE });
  up.classList.add("upcard");
  mealsEl.appendChild(up);
  tally();
}

document.getElementById("reset").addEventListener("click", function(){
  done = {}; save(); render();
});

/* ---- profiles ---- */
var setupEl = document.getElementById("setup");
var fName = document.getElementById("fName");
var fGoal = document.getElementById("fGoal");
var fDiets = document.getElementById("fDiets");
var peopleEl = document.getElementById("people");
var editing = null;   // the profile being edited, or null for a new one

DIETS.forEach(function(d){
  var l = document.createElement("label");
  l.innerHTML = '<input type="checkbox" value="' + d.k + '"> ' + d.label;
  fDiets.appendChild(l);
});

function openSetup(name){
  editing = name || null;
  var prof = name ? people[name] : null;
  fName.value = name || "";
  fGoal.value = prof ? prof.goal : "";
  Array.prototype.forEach.call(fDiets.querySelectorAll("input"), function(cb){
    cb.checked = !!(prof && prof.diets && prof.diets.indexOf(cb.value) > -1);
  });
  document.getElementById("setupDel").style.visibility =
    (name && Object.keys(people).length > 1) ? "visible" : "hidden";
  // saying which it is, because typing over the name of an existing person renames them
  document.getElementById("setupSave").textContent = editing ? "Save" : "Add person";
  document.getElementById("setupTitle").textContent = editing ? editing : "Who's eating?";
  peopleEl.textContent = "";
  Object.keys(people).forEach(function(n){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    if (n === editing) b.className = "on";
    b.addEventListener("click", function(){ openSetup(n); });
    peopleEl.appendChild(b);
  });
  if (Object.keys(people).length) {
    var add = document.createElement("button");
    add.type = "button"; add.textContent = "+ New";
    if (!editing) add.className = "on";
    add.addEventListener("click", function(){ openSetup(null); });
    peopleEl.appendChild(add);
  }
  setupEl.hidden = false;
  fName.focus();
}

document.getElementById("setupSave").addEventListener("click", function(){
  var name = (fName.value || "").trim() || "Me";
  var goal = parseInt(fGoal.value, 10);
  if (!goal || goal < 800 || goal > 8000) goal = 2400;
  var diets = [];
  Array.prototype.forEach.call(fDiets.querySelectorAll("input"), function(cb){
    if (cb.checked) diets.push(cb.value);
  });
  if (editing && editing !== name) {          // renamed: carry the ticks across
    people[name] = people[editing];
    delete people[editing];
    try {
      var old = localStorage.getItem("swipe:done:" + editing);
      if (old !== null) localStorage.setItem("swipe:done:" + name, old);
      localStorage.removeItem("swipe:done:" + editing);
    } catch (e) {}
  }
  people[name] = { goal: goal, diets: diets };
  if (who !== name) {                          // switching people swaps the ticks
    who = name;
    done = {};
    try { done = JSON.parse(localStorage.getItem("swipe:done:" + name) || "{}"); } catch (e) { done = {}; }
  }
  save();
  setupEl.hidden = true;
  render();
});

document.getElementById("setupDel").addEventListener("click", function(){
  if (!editing || Object.keys(people).length < 2) return;
  delete people[editing];
  try { localStorage.removeItem("swipe:done:" + editing); } catch (e) {}
  who = Object.keys(people)[0];
  done = {};
  try { done = JSON.parse(localStorage.getItem("swipe:done:" + who) || "{}"); } catch (e) { done = {}; }
  save();
  setupEl.hidden = true;
  render();
});

document.getElementById("who").addEventListener("click", function(){ openSetup(who); });
setupEl.addEventListener("click", function(e){
  if (e.target === setupEl && who) setupEl.hidden = true;   // no escape before the first profile
});

load();
migrate();
render();
if (!who) openSetup(null);
</script>
