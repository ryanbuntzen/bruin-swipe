<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bruin Swipe Card</title>
<meta name="description" content="Log what you eat at UCLA dining and see the full nutrient panel — calories, macros and 39 micronutrients.">
<meta name="theme-color" content="#14202c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bruin Swipe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#e9edf2; --card:#ffffff; --card-2:#f4f7fa;
  --ink:#14202c; --ink-2:#556879; --ink-3:#8496a5;
  --line:#d3dde6; --line-soft:#e4ebf1;
  --accent:#9a5c0a; --accent-soft:#f7ead6;
  --blue:#1f5379; --flag:#9c3226; --flag-soft:#f7e2de; --ok:#2c6249;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e151d; --card:#161f29; --card-2:#1c2733;
    --ink:#e7edf3; --ink-2:#9dafbd; --ink-3:#71838f;
    --line:#2a3743; --line-soft:#212d38;
    --accent:#e5a75a; --accent-soft:#3a2c17;
    --blue:#7db3d8; --flag:#e08a7c; --flag-soft:#37211d; --ok:#74bb9b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e151d; --card:#161f29; --card-2:#1c2733;
  --ink:#e7edf3; --ink-2:#9dafbd; --ink-3:#71838f;
  --line:#2a3743; --line-soft:#212d38;
  --accent:#e5a75a; --accent-soft:#3a2c17;
  --blue:#7db3d8; --flag:#e08a7c; --flag-soft:#37211d; --ok:#74bb9b;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;margin:0}
.wrap{max-width:600px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(128px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

h1{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:34px;
  line-height:.95;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font:inherit;font-size:12px;padding:4px 10px;border-radius:2px;cursor:pointer;white-space:nowrap}
.who:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* search */
.search{position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border-radius:2px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.results{list-style:none;margin:6px 0 0;padding:0;background:var(--card);
  border:1px solid var(--line);border-radius:2px;max-height:min(58vh,420px);overflow:auto}
.results:empty{display:none}

/* two-deck swipe: all-you-can-eat, then the pickup places */
.deckbar{display:flex;align-items:center;gap:8px}
.deckbar button{appearance:none;flex:1;border:1px solid var(--line);background:var(--card);
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);padding:7px 6px;border-radius:2px;cursor:pointer}
.deckbar button[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.swipehint{font-size:11px;color:var(--ink-3);text-align:center;letter-spacing:.03em}
.deck{display:grid;grid-auto-flow:column;grid-auto-columns:100%;gap:0;
  overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 -14px;padding:0 14px;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.pane{scroll-snap-align:center;display:flex;flex-direction:column;gap:12px;
  padding-right:14px;min-width:0}

.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);
  border:1px solid var(--line);padding:4px;border-radius:3px}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;flex:1 1 30%;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  padding:7px 3px;border-radius:2px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.hallhead{border-bottom:2px solid var(--ink);padding-bottom:6px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hallhead h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;margin:0;
  text-transform:uppercase;letter-spacing:.02em;line-height:1}
.daypick{appearance:none;font:inherit;font-size:12px;padding:3px 6px;border-radius:2px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2)}

/* station groups */
.meal{background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.meal > header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:8px 12px;border-bottom:1px solid var(--line-soft);background:var(--card-2)}
.meal h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.meal h3 small{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:11px;
  letter-spacing:0;text-transform:none;color:var(--ink-3);margin-left:6px}
.stationrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:7px 12px 3px;border-top:1px solid var(--line-soft)}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{border-top:1px solid var(--line-soft)}
.stationrow + ul.items li:first-child{border-top:0}
.row{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:9px 12px;background:transparent;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nm{font-size:14.5px;line-height:1.28}
.sub2{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.kc{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;text-align:right}
.kc em{display:block;font-style:normal;font-size:10px;color:var(--ink-3);
  font-family:"IBM Plex Sans",sans-serif;font-weight:400}
.plus{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600;
  color:var(--accent);width:22px;text-align:center;line-height:1}
.bpill{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:2px;padding:0 4px;margin-left:5px}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:18px 12px;overflow:auto;z-index:20}
.sheet[hidden]{display:none}
.card2{background:var(--card);border:1px solid var(--line);border-radius:3px;
  width:100%;max-width:460px;padding:15px}
.card2 h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;margin:0 0 2px;
  text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.card2 p.sub{margin:0 0 13px;font-size:12.5px;color:var(--ink-2)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:15px;padding:7px 9px;border-radius:2px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink)}
.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.diets{display:flex;flex-wrap:wrap;gap:6px}
.diets label{display:inline-flex;align-items:center;gap:5px;font-size:13px;text-transform:none;
  letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:2px;
  padding:5px 9px;cursor:pointer;margin:0}
.diets input{width:auto;margin:0}
.btns{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px}
.btn{appearance:none;font:inherit;font-size:14px;padding:9px 16px;border-radius:2px;cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.people button{appearance:none;font:inherit;font-size:13px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:2px}
.people button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* quantity stepper */
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:2px;
  overflow:hidden;width:max-content}
.qty button{appearance:none;border:0;background:var(--card-2);color:var(--ink);
  font:inherit;font-size:17px;width:38px;height:34px;cursor:pointer;line-height:1}
.qty span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.servline{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}

/* nutrient table */
.ntab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ntab th{text-align:left;font-family:"Barlow Condensed",sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:9px 0 3px;border-bottom:1px solid var(--line)}
.ntab td{padding:3px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.ntab td.v{text-align:right;white-space:nowrap;font-weight:500}
.ntab td.dv{text-align:right;width:54px;color:var(--ink-2);font-size:12.5px}
.ntab tr.major td{font-weight:600}
.est{color:var(--accent);font-size:9.5px;vertical-align:super;margin-left:2px}
.dvbar{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:2px}
.dvbar i{display:block;height:100%;background:var(--blue)}
.dvbar i.over{background:var(--flag)}
.legend{font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.45}

/* components */
.comp{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.comp .ck{width:20px;height:20px;accent-color:var(--blue)}
.comp .n2{font-size:11px;color:var(--ink-3)}
.grp{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 0 2px}

/* log */
.logrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.logrow .x{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-3);
  font:inherit;font-size:13px;width:28px;height:28px;border-radius:2px;cursor:pointer}
.empty{font-size:13px;color:var(--ink-3);padding:14px 0}

.nowpill{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--card);
  background:var(--blue);border-radius:2px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.skipbtn{appearance:none;font:inherit;font-size:13px;margin:0 6px 6px 0;padding:6px 10px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:2px;cursor:pointer}
.skipbtn.on{background:var(--blue);border-color:var(--blue);color:var(--card)}
.skipbtn span{opacity:.65;font-size:11.5px;margin-left:3px}
.offdiet{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:2px;padding:0 4px;margin-left:5px;white-space:nowrap}
.warnline{display:block;margin-top:6px;color:var(--flag);font-size:12px;line-height:1.4}
.vnote{margin:0;font-size:12.5px;color:var(--ink-2)}

/* gap recommender */
.gaps{background:var(--card);border:1px solid var(--accent);border-radius:3px;padding:11px 12px}
.gaps h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;margin:0 0 6px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.gaps .short{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.gaps .short span{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:2px 7px;
  color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.gaps p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45}
.gaps p b{color:var(--ink);font-weight:600}
.gaps .go{appearance:none;font:inherit;font-size:12.5px;margin-top:8px;padding:5px 10px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.fills{border:1px solid var(--accent)!important;background:var(--accent-soft)}
.fills > header{background:transparent}
.badge{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:2px;padding:0 4px;margin-left:5px;white-space:nowrap}

/* sticky tally */
.bar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));height:3px;background:rgba(255,255,255,.16);z-index:3}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.total{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);z-index:3;
  border:0;width:100%;text-align:left;font:inherit;cursor:pointer;display:block}
.total .inner{max-width:600px;margin:0 auto;
  padding:9px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.total .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:29px;line-height:1;
  font-variant-numeric:tabular-nums}
.total .big small{font-size:11.5px;font-weight:600;letter-spacing:.08em;opacity:.6;margin-left:5px}
.tallylbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.macros{display:flex;gap:11px;font-variant-numeric:tabular-nums}
.macros div{text-align:right}
.macros .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;line-height:1}
.macros .l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;opacity:.6;margin-top:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1>Bruin <span>Swipe</span> Card</h1>
    <button class="who" id="who" type="button">…</button>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="Search every dining item…"
           aria-label="Search food">
    <ul class="results" id="results"></ul>
  </div>

  <div class="gaps" id="gaps" hidden></div>

  <div class="deckbar" role="tablist" aria-label="Kind of place">
    <button type="button" role="tab" id="deck0">All you can eat</button>
    <button type="button" role="tab" id="deck1">Pickup, trucks &amp; to go</button>
  </div>
  <div class="swipehint">swipe sideways to switch</div>

  <div class="deck" id="deck">
    <section class="pane" id="pane0">
      <div class="tabs" role="tablist" aria-label="Dining hall"></div>
      <div class="hallhead"><h2></h2><select class="daypick" aria-label="Day"></select></div>
      <div class="menu"></div>
    </section>
    <section class="pane" id="pane1">
      <div class="tabs" role="tablist" aria-label="Pickup place"></div>
      <div class="hallhead"><h2></h2><select class="daypick" aria-label="Day"></select></div>
      <div class="menu"></div>
    </section>
  </div>
</div>

<!-- item / builder sheet -->
<div class="sheet" id="itemSheet" hidden>
  <div class="card2" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <h2 id="itemTitle"></h2>
    <p class="sub" id="itemWhere"></p>
    <div id="itemBuild"></div>
    <div id="itemRemove"></div>
    <p class="servline" id="itemServing"></p>
    <div class="qty" role="group" aria-label="How many servings">
      <button type="button" id="qMinus" aria-label="Less">−</button>
      <span id="qVal">1</span>
      <button type="button" id="qPlus" aria-label="More">+</button>
    </div>
    <div id="itemNut"></div>
    <div class="btns">
      <button class="btn ghost" id="itemClose" type="button">Close</button>
      <button class="btn" id="itemAdd" type="button">Add to today</button>
    </div>
  </div>
</div>

<!-- today's log -->
<div class="sheet" id="logSheet" hidden>
  <div class="card2" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <h2 id="logTitle">Today</h2>
    <p class="sub" id="logSub"></p>
    <div id="logList"></div>
    <div id="logNut"></div>
    <div class="btns">
      <button class="btn ghost" id="logClear" type="button">Clear day</button>
      <button class="btn" id="logClose" type="button">Done</button>
    </div>
  </div>
</div>

<!-- profiles -->
<div class="sheet" id="setup" hidden>
  <div class="card2" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h2 id="setupTitle">Who's eating?</h2>
    <p class="sub">Saved on this device only. Nothing leaves your browser.</p>
    <div class="people" id="people"></div>
    <div class="fld">
      <label for="fName">Name</label>
      <input id="fName" type="text" autocomplete="off" placeholder="Name">
    </div>
    <div class="fld">
      <label for="fGoal">Daily calorie target</label>
      <input id="fGoal" type="number" inputmode="numeric" min="800" max="8000" step="50" placeholder="2000">
    </div>
    <div class="fld">
      <label>Diet</label>
      <div class="diets" id="fDiets"></div>
    </div>
    <div class="fld">
      <label>Personal rules</label>
      <div class="diets" id="fRules"></div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="setupDel" type="button">Delete</button>
      <button class="btn" id="setupSave" type="button">Save</button>
    </div>
  </div>
</div>

<div class="bar"><i id="barFill"></i><b id="barMark"></b></div>
<button class="total" id="total" type="button">
  <div class="inner">
    <div>
      <div class="tallylbl" id="tallyLbl">Today · tap to edit</div>
      <div class="big"><span id="tKcal">0</span><small>/ <span id="tGoal">2,000</span> KCAL</small></div>
    </div>
    <div class="macros">
      <div><div class="v" id="tP">0g</div><div class="l">Protein</div></div>
      <div><div class="v" id="tF">0g</div><div class="l">Fat</div></div>
      <div><div class="v" id="tC">0g</div><div class="l">Carb</div></div>
    </div>
  </div>
</button>

<script>
"use strict";

/* ------------------------------------------------------------------ constants */

// A day rolls over at 05:00 local, not midnight — a 2am plate belongs to the night before.
var BUILD = "2026-09-29d";
var DAY_START_HOUR = 5;

// The allowlist diet and the personal target rules are one person's, not everyone's.
// The diet is not an option anyone ticks -- it applies automatically to this profile
// and is invisible to every other one, which sees the ordinary options and plain FDA
// Daily Values. Change the string to hand it to someone else.
var OWNER = "ryanbuntzen";
var OWNER_DIETS = ["animalfruit"];
function isOwner(name){ return (name || "").trim().toLowerCase() === OWNER; }

// FDA Daily Values (2016 label rules), adult.  Calories come from the profile instead.
var DV = {
  protein:50, fat:78, satfat:20, transfat:null, chol:300, sodium:2300, carb:275,
  fiber:28, sugar:null, addsugar:50, calcium:1300, iron:18, potassium:4700,
  vit_a:900, vit_b6:1.7, vit_b12:2.4, vit_c:90, vit_d:20, vit_e:15, vit_k:120,
  thiamin:1.2, riboflavin:1.3, niacin:16, folate:400, pantothenic:5, choline:550,
  magnesium:420, phosphorus:1250, zinc:11, copper:0.9, manganese:2.3, selenium:55,
  mufa:null, pufa:null, omega3_ala:1.6, omega3_epa:null, omega3_dha:null, omega6:17
};
var UNIT = {

/* ------------------------------------------------------------------ state */

var D = null;                 // the food database
var NUT = [], MEASURED = 0;
var people = {}, who = null;  // profiles
var decks = [[], []];         // venue lists: [ayce, pickup]
var sel = [0, 0];             // selected venue per deck
var day = [null, null];       // selected menu day per deck
var deckIdx = 0;

function load(){
  try {
    var raw = JSON.parse(localStorage.getItem("bruinswipe") || "{}");
    people = raw.people || {};
    who = raw.who || null;
    if (who && !people[who]) who = null;
  } catch (e) { people = {}; who = null; }
}
function save(){
  try { localStorage.setItem("bruinswipe", JSON.stringify({people:people, who:who})); }
  catch (e) {}
}
function me(){ return people[who] || {goal:2000, diets:[], log:{}, rules:[]}; }
function hasRule(k){ return isOwner(who) && (me().rules || []).indexOf(k) >= 0; }

// Per-nutrient target for the person eating.  The FDA's Daily Values assume a 2,000
// kcal day, so someone eating 3,100 needs proportionally more of anything the body
// spends alongside energy.  Opt-in, because it is a personal call, not label law.
function targets(){
  var goal = me().goal || 3100, t = {kcal: goal};
  var k = hasRule("scale") ? goal / 2000 : 1;
  Object.keys(DV).forEach(function(n){
    t[n] = DV[n] == null ? null : DV[n] * k;
  });
  // ceilings stay put: more calories is not a licence for more sodium or trans fat
  ["sodium", "satfat", "transfat", "addsugar", "chol"].forEach(function(n){
    if (DV[n] != null) t[n] = DV[n];
  });
  return t;
}

// YYYY-MM-DD for the eating day a moment belongs to
function dayKey(d){
  d = new Date(d || Date.now());
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function todayLog(){
  var p = me();
  if (!p.log) p.log = {};
  var k = dayKey();
  if (!p.log[k]) p.log[k] = [];
  // keep a fortnight; anything older is noise on a phone
  Object.keys(p.log).sort().slice(0, -14).forEach(function(old){ delete p.log[old]; });
  return p.log[k];
}

/* ------------------------------------------------------------------ nutrition math */

function zero(){ return new Array(NUT.length).fill(0); }

function vecOf(entry){
  var out = zero(), it = D.items[entry.id];
  if (!it) return out;
  if (entry.comps) {                       // a build: sum its chosen components
    Object.keys(entry.comps).forEach(function(cid){
      var n = entry.comps[cid], c = D.items[cid];
      if (!n || !c || !c.v) return;
      for (var i = 0; i < NUT.length; i++) out[i] += (c.v[i] || 0) * n;
    });
  } else if (it.v) {
    for (var i = 0; i < NUT.length; i++) out[i] = it.v[i] || 0;
  }
  (entry.skip || []).forEach(function(k){
    var r = (D.removals || {})[k];
    if (!r) return;
    for (var i = 0; i < NUT.length; i++) out[i] = Math.max(0, out[i] - (r.v[i] || 0));
  });
  var q = entry.q == null ? 1 : entry.q;
  for (var j = 0; j < out.length; j++) out[j] *= q;
  return out;
}
function sumVecs(list){
  var out = zero();
  list.forEach(function(e){
    var v = vecOf(e);
    for (var i = 0; i < out.length; i++) out[i] += v[i];
  });
  return out;
}
function get(vec, key){
  var i = NUT.indexOf(key);
  return i < 0 ? 0 : vec[i];
}
function fmt(n, unit){
  if (n === 0) return "0" + unit;
  var a = Math.abs(n);
  var s = a < 1 ? n.toFixed(2) : (a < 10 ? n.toFixed(1) : Math.round(n).toString());
  return s.replace(/\.0+$/, "") + unit;
}
function isEstimated(key){ return NUT.indexOf(key) >= MEASURED; }

function nutTable(vec, opts){
  opts = opts || {};
  var T = targets();
  var anyEst = false;
  var html = '<table class="ntab">';
  SECTIONS.forEach(function(sec){
    html += '<tr><th>' + sec[0] + '</th><th class="dv">%DV</th></tr>';
    sec[1].forEach(function(k){
      if (NUT.indexOf(k) < 0) return;
      var val = get(vec, k);
      if (!val && k !== "kcal" && !MAJOR[k]) return;          // skip empty trace rows
      var dv = T[k];
      var pct = dv ? Math.round(val / dv * 100) : null;
      var est = isEstimated(k);
      if (est) anyEst = true;
      html += '<tr' + (MAJOR[k] ? ' class="major"' : '') + '>' +
        '<td>' + LABEL[k] + (est ? '<span class="est" title="estimated from ingredients">est</span>' : '') + '</td>' +
        '<td class="v">' + fmt(val, UNIT[k]) + '</td>' +
        '<td class="dv">' + (pct == null ? "—" : pct + "%") +
          (pct == null ? "" : '<div class="dvbar"><i class="' + (pct > 100 ? "over" : "") +
            '" style="width:' + Math.min(100, pct) + '%"></i></div>') +
        '</td></tr>';
    });
  });
  // omega-3 to omega-6 balance: a ratio, so it needs its own row rather than a %DV
  var o3 = get(vec, "omega3_ala") + get(vec, "omega3_epa") + get(vec, "omega3_dha");
  var o6 = get(vec, "omega6");
  if (o3 > 0 || o6 > 0) {
    var r = o3 > 0 ? o6 / o3 : Infinity;
    var band = hasRule("omega");
    var good = r >= 1 && r <= 2;
    var txt = o3 > 0 ? "1 : " + (isFinite(r) ? r.toFixed(1) : "∞") : "no omega-3";
    html += '<tr><th>Omega balance</th><th class="dv">' + (band ? "1:1–1:2" : "") + '</th></tr>' +
      '<tr class="major"><td>Omega-3 : Omega-6<span class="est">est</span></td>' +
      '<td class="v" style="color:' + (band ? (good ? "var(--ok)" : "var(--flag)") : "inherit") + '">' +
      txt + '</td><td class="dv">' + (band ? (good ? "in band" : "off") : "—") + '</td></tr>';
    anyEst = true;
  }
  html += "</table>";
  if (anyEst)
    html += '<p class="legend"><b>est</b> — UCLA publishes 19 nutrients per item. ' +
            'The rest are computed from its ingredient list: each ingredient matched to ' +
            'USDA SR Legacy, then the grams solved so the result reproduces UCLA\'s own ' +
            'published panel. Treat them as good estimates, not label data.</p>';
  return html;
}

/* ------------------------------------------------------------------ diet filter */

function blocked(it){
  var p = me();
  var d = (p.diets || []).filter(function(k){
    return !DIET_BY_KEY[k] || !DIET_BY_KEY[k].owner;   // owner diets are never ticked
  });
  if (isOwner(who)) d = d.concat(OWNER_DIETS);         // they just apply
  if (!d.length) return false;
  var hay = it.n + " " + (it.a || []).join(" ");
  for (var i = 0; i < DIETS.length; i++) {
    var D = DIETS[i];
    if (d.indexOf(D.k) < 0) continue;
    if (D.allow) {
      if (D.deny && D.deny.test(it.n)) return true;  // deny beats allow
      if (!D.allow.test(it.n)) return true;          // anything unnamed is out
      continue;
    }
    if (D.k === "vegetarian" && (it.t || []).indexOf("vegan") >= 0) continue;
    if (D.k === "vegetarian" && (it.t || []).indexOf("vegetarian") >= 0) continue;
    if (D.bad.test(hay)) return true;
  }
  return false;
}

/* ------------------------------------------------------------------ gap recommender

   Once something is logged, work out which nutrients are furthest behind for the day,
   then score every item by how much of that shortfall it closes per calorie.  Places
   are scored by their best few items, so the app can say "go to Bruin Plate" — and if
   you walk into De Neve instead, that hall's own best gap-fillers are still flagged.   */

// Nutrients worth chasing.  Ceilings (sodium, saturated fat, added sugar) are left out:
// falling short of those is the goal, not a gap.
var CHASE = ["protein","fiber","potassium","calcium","iron","magnesium","phosphorus","zinc",
             "copper","manganese","selenium","vit_a","vit_c","vit_d","vit_e","vit_k",
             "thiamin","riboflavin","niacin","vit_b6","folate","vit_b12","pantothenic",
             "choline","omega3_ala","omega3_epa","omega3_dha"];

function gaps(){
  var log = todayLog();
  if (!log.length) return [];                       // nothing to advise on before the first meal
  var v = sumVecs(log), T = targets(), out = [];
  CHASE.forEach(function(k){
    if (NUT.indexOf(k) < 0 || !T[k]) return;
    var got = get(v, k), frac = got / T[k];
    if (frac >= 0.95) return;
    out.push({k:k, frac:frac, missing:T[k] - got, target:T[k]});
  });
  // omega-3 counts as a gap when the ratio has drifted past 1:2
  if (hasRule("omega")) {
    var o3 = get(v, "omega3_ala") + get(v, "omega3_epa") + get(v, "omega3_dha");
    var o6 = get(v, "omega6");
    if (o3 > 0 && o6 / o3 > 2) out.push({k:"omega3_ala", frac:0.2, missing:o6 / 2 - o3,
                                         target:o6 / 2, ratio:true});
  }
  out.sort(function(a, b){ return a.frac - b.frac; });
  return out.slice(0, 8);
}

function scoreItem(it, gl){
  if (!it.v || !gl.length) return 0;
  var s = 0;
  gl.forEach(function(g, i){
    var w = 1 - i / (gl.length + 1);                // the furthest-behind nutrient matters most
    var share = get(it.v, g.k) / Math.max(g.missing, 1e-9);
    s += w * Math.min(share, 1);
  });
  // per-calorie, so a 1,200 kcal platter does not win on bulk alone
  return s / (1 + (it.v[0] || 0) / 350);
}

function bestAt(venue, gl, n){
  var seen = {}, out = [];
  var d = pickDay(venue, day[venue.kind === "ayce" ? 0 : 1]);
  var meals = venue.menu[d] || {};
  Object.keys(meals).forEach(function(m){
    meals[m].forEach(function(row){
      var rid = row[1], it = D.items[rid];
      if (!it || !it.v || seen[rid] || blocked(it)) return;
      seen[rid] = 1;
      var sc = scoreItem(it, gl);
      if (sc > 0.02) out.push({id:rid, it:it, score:sc, station:row[0]});
    });
  });
  out.sort(function(a, b){ return b.score - a.score; });
  return out.slice(0, n || 4);
}

function renderGaps(){
  var el = document.getElementById("gaps");
  var gl = gaps();
  if (!gl.length) { el.hidden = true; recIds = {}; return; }

  // rank the places by what their best handful of items would close
  var ranked = D.venues.map(function(v){
    var top = bestAt(v, gl, 4);
    return {v:v, score:top.reduce(function(a, b){ return a + b.score; }, 0), top:top};
  }).filter(function(r){ return r.score > 0; });
  ranked.sort(function(a, b){ return b.score - a.score; });

  recIds = {};
  ranked.slice(0, 3).forEach(function(r){ r.top.forEach(function(t){ recIds[t.id] = 1; }); });

  el.innerHTML = '<h3>Still short today</h3><div class="short">' +
    gl.slice(0, 5).map(function(g){
      return "<span>" + LABEL[g.k] + " " + Math.round(g.frac * 100) + "%" +
             (g.ratio ? " (ratio)" : "") + "</span>";
    }).join("") + "</div>" +
    (ranked.length
      ? "<p>Best place for that right now: <b>" + esc(ranked[0].v.n) + "</b> — " +
        ranked[0].top.slice(0, 2).map(function(t){ return esc(t.it.n); }).join(", ") +
        ".</p><button class=\"go\" type=\"button\" id=\"gapGo\">Show me</button>"
      : "<p>Nothing on today's menus moves those much.</p>");
  el.hidden = false;
  var go = document.getElementById("gapGo");
  if (go) go.onclick = function(){
    var v = ranked[0].v, di = v.kind === "ayce" ? 0 : 1;
    sel[di] = decks[di].indexOf(v);
    setDeck(di); renderDeck(di);
  };
}

/* ------------------------------------------------------------------ meal suggestion

   "What should I eat here" rather than "here are 300 items". Built from the menu that
   is actually up, so it stays right as the halls rotate, and shaped like a plate: a
   protein, a starch, fruit, something dairy, then topped up with more protein if the
   meal is still short. Respects the diet filter and leans toward whatever the day is
   behind on.                                                                          */

var CAT = [
  ["protein", /\b(egg|eggs|omelet|beef|steak|tri.?tip|sirloin|brisket|burger|cheeseburger|hamburger|patty|meatball|lamb|pork|bacon|ham|sausage|carnitas|chorizo|riblet|pastrami|gyudon|carne|chicken|turkey|fish|salmon|tuna|shrimp|cod|tilapia|katsu|tofu|tempeh)\b/i],
  ["carb",    /\b(rice|potato|yam|pasta|noodle|quinoa|bread|tortilla|oat|grain|farro|barley)\b/i],
  ["fruit",   /\b(fruit|apple|banana|orange|grape|melon|cantaloupe|watermelon|pineapple|mango|kiwi|berry|berries|strawberr|blueberr|peach|pear|plum|cherry)\b/i],
  ["dairy",   /\b(milk|yogurt|yoghurt|cottage|cheese)\b/i]
];
function catOf(name){
  for (var i = 0; i < CAT.length; i++) if (CAT[i][1].test(name)) return CAT[i][0];
  return "other";
}
function jitter(str, seed){          // stable pseudo-random so a plate does not reshuffle on every repaint
  var h = 2166136261 ^ seed;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

// A plate is a template with slots, not an optimiser. The hand-built plans read well
// because they said "five eggs, two sausage links, a fruit bowl, a glass of milk" --
// so fill those same slots from whatever is on the menu today.
var SLOTS = {
  Breakfast: [
    {n:"eggs",   re:/\b(fried egg|scrambled egg|hard cooked egg|poached egg|omelet|^egg)/i, q:5, cap:6,
     avoid:/white|vegan|plant|substitute/i},   // whole eggs win on density, not just protein
    {n:"meat",   re:/\b(bacon|sausage|chorizo|ham|links|steak|carnitas|tri.?tip)\b/i,       q:2, cap:4},
    {n:"fruit",  re:/\b(fruit|cantaloupe|watermelon|pineapple|melon|grape|banana|apple|orange|kiwi|mango|berr)/i, q:2, cap:4},
    {n:"dairy",  re:/\b(milk|yogurt|cottage|cheese)\b/i,                                    q:1, cap:2}
  ],
  Main: [
    {n:"main",   re:/\b(beef|steak|tri.?tip|sirloin|brisket|burger|patty|lamb|pork|riblet|carnitas|chorizo|ribs|meatball|gyudon|carne)\b/i, q:1, cap:3},
    {n:"second", re:/\b(chicken|turkey|salmon|fish|shrimp|tuna|katsu|cod)\b/i,               q:1, cap:3},
    {n:"starch", re:/\b(rice|sweet potato|yam|potato)\b/i,                                   q:2, cap:4},
    {n:"fruit",  re:/\b(fruit|cantaloupe|watermelon|pineapple|melon|grape|banana|apple|orange|kiwi|mango|berr)/i, q:2, cap:4},
    {n:"dairy",  re:/\b(milk|yogurt|cottage|cheese)\b/i,                                     q:1, cap:2}
  ],
  Late: [
    {n:"main",   re:/\b(beef|steak|burger|patty|chicken|pork|bacon|sausage|egg|salmon|shrimp)\b/i, q:1, cap:3},
    {n:"starch", re:/\b(rice|sweet potato|yam|potato)\b/i,                                   q:1, cap:3},
    {n:"dairy",  re:/\b(milk|yogurt|cottage|cheese)\b/i,                                     q:1, cap:2}
  ]
};
// Which meal you could walk into right now. Dining halls run breakfast until about
// 10:30, lunch to 4, dinner to 9, and anything later is the late-night counter.
function currentMeal(){
  var d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h < DAY_START_HOUR) return "Late";
  if (h < 10.5) return "Breakfast";
  if (h < 16) return "Lunch";
  if (h < 21) return "Dinner";
  return "Late";
}
function mealMatchesNow(meal){
  var now = currentMeal();
  if (now === "Late") return /late|night|all ?day/i.test(meal);
  return new RegExp(now === "Breakfast" ? "break|brunch" : now, "i").test(meal);
}

function slotsFor(meal){
  if (/break|brunch/i.test(meal)) return SLOTS.Breakfast;
  if (/late|night/i.test(meal)) return SLOTS.Late;
  return SLOTS.Main;
}

function suggestPlate(rows, seed, meal){
  var gl = gaps();
  var pool = [], seen = {};
  rows.forEach(function(row){
    var rid = row[1], it = D.items[rid];
    if (!it || !it.v || !it.v[0] || seen[rid] || it.batch || blocked(it)) return;
    seen[rid] = 1;
    pool.push({id: rid, it: it, station: row[0]});
  });
  if (!pool.length) return null;

  var goal = me().goal || 2000;
  var tK = goal / 3;
  var slots = slotsFor(meal || "");
  var picks = [], kcal = 0, used = {};

  slots.forEach(function(slot){
    var best = null, bs = -Infinity;
    pool.forEach(function(p){
      if (used[p.id] || !slot.re.test(p.it.n)) return;
      if (kcal + p.it.v[0] * slot.q > tK * 1.3) return;
      // within a slot, prefer the denser option, nudged by today's gaps and the shuffle
      var sc = get(p.it.v, "protein") / Math.max(1, p.it.v[0] / 100)
             + scoreItem(p.it, gl) * 2 + jitter(p.id, seed);
      if (slot.avoid && slot.avoid.test(p.it.n)) sc -= 5;
      if (sc > bs) { bs = sc; best = p; }
    });
    if (!best) return;
    used[best.id] = 1;
    best.q = slot.q;
    best.slot = slot;
    picks.push(best);
    kcal += best.it.v[0] * best.q;
  });
  if (!picks.length) return null;

  // top up toward the calorie target, respecting each slot's own ceiling
  for (var guard = 0; guard < 30 && kcal < tK * 0.92; guard++) {
    var pick = null, ps = -Infinity;
    picks.forEach(function(p){
      var cals = p.it.v[0];
      if (p.q >= (p.slot.cap || 3) || cals <= 0 || kcal + cals > tK * 1.12) return;
      var sc = -p.q;
      if (sc > ps) { ps = sc; pick = p; }
    });
    if (!pick) break;
    pick.q += 1;
    kcal += pick.it.v[0];
  }

  var prot = picks.reduce(function(a, p){ return a + get(p.it.v, "protein") * p.q; }, 0);
  return {picks: picks, kcal: kcal, prot: prot, target: tK};
}

var plateSeed = {};

function plateCard(vkey, meal, rows){
  var key = vkey + "|" + meal;
  var seed = plateSeed[key] || 0;
  var plate = suggestPlate(rows, seed, meal);
  if (!plate) return null;
  var sec = document.createElement("section");
  sec.className = "meal plate";
  sec.innerHTML =
    '<header><div><h3>Eat this' +
      (mealMatchesNow(meal) ? '<span class="nowpill">now</span>' : '') +
      '<small>a ' + Math.round(plate.kcal) + ' kcal plate, ' +
      Math.round(plate.prot) + ' g protein</small></h3></div>' +
    '<div class="mealkcal">' + Math.round(plate.kcal) + '<small>of ' +
      Math.round(plate.target) + '</small></div></header>' +
    '<ul class="items">' + plate.picks.map(function(p){
      var q = p.q || 1;
      return '<li><button class="row" data-id="' + p.id + '">' +
        '<span><span class="nm">' + (q > 1 ? q + "&times; " : "") + esc(p.it.n) + '</span>' +
        '<span class="sub2">' + esc(p.station) +
          (p.it.s ? " · " + (q > 1 ? q + " &times; " : "") + esc(p.it.s) : "") + '</span></span>' +
        '<span class="kc">' + Math.round(p.it.v[0] * q) + '</span><span class="plus">+</span></button></li>';
    }).join("") + '</ul>' +
    '<div class="plateacts"><button type="button" class="btn ghost" data-shuffle="' + key + '">Different plate</button>' +
    '<button type="button" class="btn" data-logplate="' + key + '">Log the plate</button></div>';

  sec.querySelector("[data-shuffle]").onclick = function(){
    plateSeed[key] = seed + 1;
    renderDeck(decks[0].some(function(v){ return v.k === vkey; }) ? 0 : 1);
  };
  sec.querySelector("[data-logplate]").onclick = function(){
    plate.picks.forEach(function(p){ todayLog().push({id: p.id, q: p.q || 1}); });
    save(); tally(); renderDeck(0); renderDeck(1); openLog();
  };
  return sec;
}

/* ------------------------------------------------------------------ render: decks */

function menuDays(v){ return Object.keys(v.menu).sort(); }

function pickDay(v, want){
  var days = menuDays(v);
  if (days.indexOf(want) >= 0) return want;
  var t = dayKey();
  if (days.indexOf(t) >= 0) return t;
  if (days.indexOf("standing") >= 0) return "standing";
  return days[days.length - 1];
}

function renderDeck(di){
  var pane = document.getElementById("pane" + di);
  var tabs = pane.querySelector(".tabs");
  var h2 = pane.querySelector("h2");
  var daySel = pane.querySelector(".daypick");
  var menuEl = pane.querySelector(".menu");
  var list = decks[di];
  if (!list.length) { menuEl.innerHTML = '<p class="empty">Nothing published.</p>'; return; }

  tabs.innerHTML = "";
  list.forEach(function(v, i){
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.textContent = v.n;
    b.setAttribute("aria-selected", i === sel[di] ? "true" : "false");
    b.addEventListener("click", function(){ sel[di] = i; day[di] = null; renderDeck(di); });
    tabs.appendChild(b);
  });

  var v = list[sel[di]];
  h2.textContent = v.n;
  var noteEl = pane.querySelector(".vnote");
  if (!noteEl) {
    noteEl = document.createElement("p");
    noteEl.className = "vnote";
    pane.querySelector(".hallhead").insertAdjacentElement("afterend", noteEl);
  }
  noteEl.textContent = v.note || "";
  noteEl.hidden = !v.note;
  var d = day[di] = pickDay(v, day[di]);
  var days = menuDays(v);
  daySel.hidden = days.length < 2;
  daySel.innerHTML = days.map(function(x){
    var lbl = x === "standing" ? "Every day"
      : new Date(x + "T12:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
    return '<option value="' + x + '"' + (x === d ? " selected" : "") + ">" + lbl + "</option>";
  }).join("");
  daySel.onchange = function(){ day[di] = daySel.value; renderDeck(di); };

  var meals = v.menu[d] || {};
  var order = ["Breakfast", "Brunch", "Lunch", "Dinner", "Allday", "All day"];
  var keys = Object.keys(meals).sort(function(a, b){
    var na = mealMatchesNow(a) ? 0 : 1, nb = mealMatchesNow(b) ? 0 : 1;
    if (na !== nb) return na - nb;            // whatever is being served now goes first
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  menuEl.innerHTML = "";

  // whatever place you actually walked into, surface its own best gap-fillers first
  var gl = gaps();
  if (gl.length) {
    var top = bestAt(v, gl, 4);
    if (top.length) {
      var sec0 = document.createElement("section");
      sec0.className = "meal fills";
      sec0.innerHTML = '<header><h3>Fills your gaps here<small>' +
        gl.slice(0, 3).map(function(g){ return LABEL[g.k]; }).join(", ") + '</small></h3></header>' +
        '<ul class="items">' + top.map(function(t){
          return '<li><button class="row" data-id="' + t.id + '">' +
            '<span><span class="nm">' + esc(t.it.n) + '</span>' +
            '<span class="sub2">' + esc(t.station) + (t.it.s ? " · " + esc(t.it.s) : "") + '</span></span>' +
            '<span class="kc">' + Math.round(t.it.v[0]) + '</span><span class="plus">+</span></button></li>';
        }).join("") + '</ul>';
      menuEl.appendChild(sec0);
    }
  }

  keys.forEach(function(meal){
    var byStation = {};
    meals[meal].forEach(function(row){
      (byStation[row[0]] = byStation[row[0]] || []).push(row[1]);
    });
    var shown = 0, hidden = 0, inner = "";
    Object.keys(byStation).forEach(function(st){
      var rows = "";
      byStation[st].forEach(function(rid){
        var it = D.items[rid];
        if (!it) return;
        if (blocked(it)) { hidden++; return; }
        shown++;
        rows += '<li><button class="row" data-id="' + rid + '">' +
          '<span><span class="nm">' + esc(it.n) +
            (it.b ? '<span class="bpill">build</span>' : '') +
            (recIds[rid] ? '<span class="badge">fills a gap</span>' : '') + '</span>' +
            '<span class="sub2">' + (it.s ? esc(it.s) : "choose components") + '</span></span>' +
          '<span class="kc">' + (it.v ? Math.round(it.v[0]) : "—") +
            '<em>' + (it.v ? "P" + Math.round(get(it.v, "protein")) +
                             " F" + Math.round(get(it.v, "fat")) +
                             " C" + Math.round(get(it.v, "carb")) : "build") + '</em></span>' +
          '<span class="plus">+</span></button></li>';
      });
      if (rows) inner += '<div class="stationrow">' + esc(st) + '</div><ul class="items">' + rows + '</ul>';
    });
    if (!shown) return;
    var card = plateCard(v.k, meal, meals[meal]);
    if (card) menuEl.appendChild(card);
    var sec = document.createElement("section");
    sec.className = "meal";
    sec.innerHTML = '<header><h3>' + esc(meal) +
      (mealMatchesNow(meal) ? '<span class="nowpill">now</span>' : '') +
      '<small>' + shown + ' items' +
      (hidden ? " · " + hidden + " hidden by diet" : "") + '</small></h3></header>' + inner;
    menuEl.appendChild(sec);
  });
  if (!menuEl.children.length) menuEl.innerHTML = '<p class="empty">Nothing on this day\'s menu.</p>';
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c];
  });
}

/* ------------------------------------------------------------------ item sheet */

var cur = null;   // {id, q, comps}
var itemSheet = document.getElementById("itemSheet");

function openItem(rid){
  var it = D.items[rid];
  if (!it) return;
  cur = {id: rid, q: 1, comps: null, skip: []};
  if (it.b) {
    cur.comps = {};
    // start with nothing selected; the first group is usually the base
    it.b.forEach(function(g){ g.forEach(function(cid){ cur.comps[cid] = 0; }); });
  }
  document.getElementById("itemTitle").textContent = it.n;
  var wh = [];
  (D.venues || []).forEach(function(v){
    Object.keys(v.menu).forEach(function(d){
      Object.keys(v.menu[d]).forEach(function(m){
        v.menu[d][m].forEach(function(row){
          if (row[1] === rid && wh.indexOf(v.n + " · " + row[0]) < 0) wh.push(v.n + " · " + row[0]);
        });
      });
    });
  });
  var whEl = document.getElementById("itemWhere");
  whEl.textContent = wh.slice(0, 3).join("   ");
  if (it.batch) {
    whEl.innerHTML = esc(wh.slice(0, 2).join("   ")) +
      '<span class="warnline">UCLA lists this at ' + esc(it.s || "") +
      ' — that is the batch the kitchen makes, not a plate. Dial the servings down to ' +
      'the fraction you actually take.</span>';
  }
  if (it.src === "reconstructed") {
    whEl.innerHTML = esc(wh.slice(0, 2).join("   ")) +
      '<span class="warnline">Nobody publishes a panel for a food truck. ' +
      'Every number here is reconstructed from the vendor\'s own description of the item' +
      (it.d ? " — " + esc(it.d) : "") + ', priced against USDA. Treat it as a ballpark.</span>';
  }
  document.getElementById("itemServing").textContent =
    it.s ? ("One serving: " + it.s + (it.g ? " (" + it.g + " g)" : "")) : "";
  renderItem();
  itemSheet.hidden = false;
}

function renderItem(){
  var it = D.items[cur.id];
  var bEl = document.getElementById("itemBuild");
  if (cur.comps) {
    var html = "";
    it.b.forEach(function(g, gi){
      html += '<div class="grp">' + (gi === 0 ? "Base" : "Add") + '</div>';
      g.forEach(function(cid){
        var c = D.items[cid];
        if (!c) return;
        var n = cur.comps[cid] || 0;
        html += '<div class="comp">' +
          '<span>' + esc(c.n) + '<span class="n2">' +
            (c.s ? esc(c.s) + " · " : "") + (c.v ? Math.round(c.v[0]) + " kcal" : "no data") +
          '</span></span>' +
          '<span class="qty"><button type="button" data-cm="' + cid + '">−</button>' +
            '<span>' + n + '</span>' +
            '<button type="button" data-cp="' + cid + '">+</button></span>' +
        '</div>';
      });
    });
    bEl.innerHTML = html;
    bEl.querySelectorAll("[data-cp]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-cp");
        cur.comps[id] = Math.min(10, (cur.comps[id] || 0) + 1);
        renderItem();
      };
    });
    bEl.querySelectorAll("[data-cm]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-cm");
        cur.comps[id] = Math.max(0, (cur.comps[id] || 0) - 1);
        renderItem();
      };
    });
  } else {
    bEl.innerHTML = "";
  }
  var g = D.items[cur.id].g;
  var rmEl = document.getElementById("itemRemove");
  if (it.rm && it.rm.length && D.removals) {
    rmEl.innerHTML = '<div class="grp">Leaving anything?</div>' + it.rm.map(function(k){
      var r = D.removals[k];
      if (!r) return "";
      var on = cur.skip.indexOf(k) >= 0;
      return '<button type="button" class="skipbtn' + (on ? " on" : "") + '" data-skip="' + k + '">' +
        (on ? "\u2713 skipping " : "Skip ") + esc(r.label) +
        ' <span>&minus;' + Math.round(r.v[0]) + ' kcal</span></button>';
    }).join("");
    rmEl.querySelectorAll("[data-skip]").forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-skip"), i = cur.skip.indexOf(k);
        if (i < 0) cur.skip.push(k); else cur.skip.splice(i, 1);
        renderItem();
      };
    });
  } else {
    rmEl.innerHTML = "";
  }
  document.getElementById("qVal").textContent =
    (cur.q === 0.5 ? "½" : cur.q) + (cur.q === 1 ? " serving" : " servings") +
    (g ? "  ·  " + Math.round(g * cur.q) + " g" : "");
  document.getElementById("itemNut").innerHTML = nutTable(vecOf(cur));
}

document.getElementById("qPlus").onclick = function(){
  cur.q = cur.q < 1 ? 1 : cur.q + 1; renderItem();
};
document.getElementById("qMinus").onclick = function(){
  var steps = [0.05, 0.1, 0.25, 0.5, 1];      // batch-sized items need small fractions
  if (cur.q > 1) { cur.q -= 1; }
  else {
    var i = steps.indexOf(cur.q);
    cur.q = i > 0 ? steps[i - 1] : (cur.q > 0.5 ? 0.5 : steps[0]);
  }
  renderItem();
};
document.getElementById("itemClose").onclick = function(){ itemSheet.hidden = true; };
document.getElementById("itemAdd").onclick = function(){
  var e = {id: cur.id, q: cur.q};
  if (cur.skip && cur.skip.length) e.skip = cur.skip.slice();
  if (cur.comps) {
    var picked = {};
    Object.keys(cur.comps).forEach(function(k){ if (cur.comps[k]) picked[k] = cur.comps[k]; });
    if (!Object.keys(picked).length) return;       // nothing chosen yet
    e.comps = picked;
  }
  todayLog().push(e);
  save(); tally(); renderDeck(0); renderDeck(1);
  itemSheet.hidden = true;
};
itemSheet.onclick = function(ev){ if (ev.target === itemSheet) itemSheet.hidden = true; };

/* ------------------------------------------------------------------ today sheet */

var logSheet = document.getElementById("logSheet");

function openLog(){
  var log = todayLog();
  var d = new Date();
  document.getElementById("logSub").textContent =
    new Date(dayKey() + "T12:00").toLocaleDateString(undefined,
      {weekday:"long", month:"long", day:"numeric"}) +
    " · rolls over at 5am" + (d.getHours() < DAY_START_HOUR ? " (still last night)" : "");
  var el = document.getElementById("logList");
  if (!log.length) {
    el.innerHTML = '<p class="empty">Nothing logged yet. Tap any item to add it.</p>';
  } else {
    el.innerHTML = log.map(function(e, i){
      var it = D.items[e.id] || {n:"(gone)"};
      var v = vecOf(e);
      var extra = e.comps ? Object.keys(e.comps).map(function(c){
        return (D.items[c] || {n:"?"}).n + (e.comps[c] > 1 ? " ×" + e.comps[c] : "");
      }).join(", ") : "";
      if (e.skip && e.skip.length) {
        extra += (extra ? " \u00b7 " : "") + "no " + e.skip.map(function(k){
          return ((D.removals || {})[k] || {label: k}).label.replace(/^the /, "");
        }).join(", no ");
      }
      return '<div class="logrow"><span>' + esc(it.n) +
        (e.q !== 1 ? " ×" + e.q : "") +
        (extra ? '<span class="n2" style="display:block;font-size:11px;color:var(--ink-3)">' +
                 esc(extra) + "</span>" : "") +
        '</span><span style="font-variant-numeric:tabular-nums">' + Math.round(v[0]) + '</span>' +
        '<button class="x" type="button" data-rm="' + i + '" aria-label="Remove">×</button></div>';
    }).join("");
    el.querySelectorAll("[data-rm]").forEach(function(b){
      b.onclick = function(){
        todayLog().splice(+b.getAttribute("data-rm"), 1);
        save(); tally(); renderDeck(0); renderDeck(1); openLog();
      };
    });
  }
  document.getElementById("logNut").innerHTML = nutTable(sumVecs(log));
  logSheet.hidden = false;
}
document.getElementById("logClose").onclick = function(){ logSheet.hidden = true; };
document.getElementById("logClear").onclick = function(){
  if (!todayLog().length) { logSheet.hidden = true; return; }
  me().log[dayKey()] = [];
  save(); tally(); openLog();
};
logSheet.onclick = function(ev){ if (ev.target === logSheet) logSheet.hidden = true; };
document.getElementById("total").onclick = openLog;

/* ------------------------------------------------------------------ tally bar */

function tally(){
  var v = sumVecs(todayLog()), goal = me().goal || 2000;
  document.getElementById("tKcal").textContent = Math.round(v[0]).toLocaleString();
  document.getElementById("tGoal").textContent = goal.toLocaleString();
  document.getElementById("tP").textContent = Math.round(get(v, "protein")) + "g";
  document.getElementById("tF").textContent = Math.round(get(v, "fat")) + "g";
  document.getElementById("tC").textContent = Math.round(get(v, "carb")) + "g";
  document.getElementById("barFill").style.width = Math.min(100, v[0] / goal * 100) + "%";
  document.getElementById("barMark").style.left = "100%";
  renderGaps();
  var n = todayLog().length;
  document.getElementById("tallyLbl").textContent =
    n ? "Today · " + n + " item" + (n > 1 ? "s" : "") + " · tap to edit" : "Today · tap to edit";
}

/* ------------------------------------------------------------------ search */

var qEl = document.getElementById("q"), resEl = document.getElementById("results");
qEl.addEventListener("input", function(){
  var q = qEl.value.trim().toLowerCase();
  if (q.length < 2) { resEl.innerHTML = ""; return; }
  var hits = [];
  for (var rid in D.items) {
    var it = D.items[rid];
    if (it.n.toLowerCase().indexOf(q) < 0) continue;
    hits.push([rid, it, blocked(it)]);
    if (hits.length > 60) break;
  }
  hits.sort(function(a, b){ return a[1].n.length - b[1].n.length; });
  resEl.innerHTML = hits.slice(0, 30).map(function(h){
    return '<li><button class="row" data-id="' + h[0] + '">' +
      '<span><span class="nm">' + esc(h[1].n) + (h[1].b ? '<span class="bpill">build</span>' : '') +
      (h[2] ? '<span class="offdiet">off diet</span>' : '') +
      '</span><span class="sub2">' + (h[1].s ? esc(h[1].s) : "choose components") + '</span></span>' +
      '<span class="kc">' + (h[1].v ? Math.round(h[1].v[0]) : "—") + '</span>' +
      '<span class="plus">+</span></button></li>';
  }).join("");
});

/* ------------------------------------------------------------------ profiles */

var setupEl = document.getElementById("setup");
var fName = document.getElementById("fName"), fGoal = document.getElementById("fGoal");
var fDiets = document.getElementById("fDiets"), peopleEl = document.getElementById("people");
var editing = null;

function paintDietOptions(name){
  fDiets.innerHTML = "";
  DIETS.forEach(function(d){
    if (d.owner) return;        // applies automatically to its owner, never a checkbox
    var l = document.createElement("label");
    l.innerHTML = '<input type="checkbox" value="' + d.k + '"> ' + d.n;
    fDiets.appendChild(l);
  });
}
var RULES = [
  {k:"scale", n:"Scale nutrient targets to my calories"},
  {k:"omega", n:"Hold omega-3:6 between 1:1 and 1:2"}
];
var fRules = document.getElementById("fRules");
function paintRuleOptions(name){
  fRules.innerHTML = "";
  RULES.forEach(function(r){
    var l = document.createElement("label");
    l.innerHTML = '<input type="checkbox" value="' + r.k + '"> ' + r.n;
    fRules.appendChild(l);
  });
  fRules.parentNode.hidden = !isOwner(name);
}

function openSetup(name){
  editing = name || null;
  peopleEl.innerHTML = "";
  Object.keys(people).forEach(function(n){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    if (n === who) b.className = "on";
    b.onclick = function(){ who = n; save(); afterProfile(); setupEl.hidden = true; };
    peopleEl.appendChild(b);
  });
  var add = document.createElement("button");
  add.type = "button"; add.textContent = "+ new";
  add.onclick = function(){ editing = null; fName.value = ""; fGoal.value = ""; setDiets([]); };
  peopleEl.appendChild(add);

  var p = editing ? people[editing] : null;
  paintDietOptions(editing);
  paintRuleOptions(editing);
  fName.value = editing || "";
  fGoal.value = p ? p.goal : "";
  setDiets(p ? (p.diets || []) : []);
  setRules(p ? (p.rules || []) : []);
  document.getElementById("setupDel").hidden = !editing;
  setupEl.hidden = false;
}
function setDiets(list){
  fDiets.querySelectorAll("input").forEach(function(i){ i.checked = list.indexOf(i.value) >= 0; });
}
function setRules(list){
  fRules.querySelectorAll("input").forEach(function(i){ i.checked = list.indexOf(i.value) >= 0; });
}
fName.addEventListener("input", function(){
  var keepD = [], keepR = [];
  fDiets.querySelectorAll("input").forEach(function(i){ if (i.checked) keepD.push(i.value); });
  fRules.querySelectorAll("input").forEach(function(i){ if (i.checked) keepR.push(i.value); });
  paintDietOptions(fName.value);
  paintRuleOptions(fName.value);
  setDiets(keepD); setRules(keepR);
});

document.getElementById("setupSave").onclick = function(){
  var name = fName.value.trim() || "Me";
  var goal = Math.max(800, Math.min(8000, parseInt(fGoal.value, 10) || 2000));
  var diets = [];
  fDiets.querySelectorAll("input").forEach(function(i){ if (i.checked) diets.push(i.value); });
  var rules = [];
  fRules.querySelectorAll("input").forEach(function(i){ if (i.checked) rules.push(i.value); });
  var keepLog = (editing && people[editing] && people[editing].log) || {};
  if (editing && editing !== name) delete people[editing];
  people[name] = {goal: goal, diets: diets, rules: rules, log: keepLog};
  who = name;
  save(); afterProfile(); setupEl.hidden = true;
};
document.getElementById("setupDel").onclick = function(){
  if (editing) delete people[editing];
  who = Object.keys(people)[0] || null;
  save();
  if (!who) openSetup(); else { afterProfile(); setupEl.hidden = true; }
};
document.getElementById("who").onclick = function(){ openSetup(who); };
setupEl.onclick = function(ev){ if (ev.target === setupEl && who) setupEl.hidden = true; };

function afterProfile(){
  document.getElementById("who").textContent = who ? who + " · " + (me().goal || 3100) : "set up";
  renderDeck(0); renderDeck(1); tally();
}

/* ------------------------------------------------------------------ deck swipe */

var deck = document.getElementById("deck");
function setDeck(i){
  deckIdx = i;
  deck.scrollTo({left: i * deck.clientWidth, behavior: "smooth"});
  syncDeckBar();
}
function syncDeckBar(){
  document.getElementById("deck0").setAttribute("aria-selected", deckIdx === 0 ? "true" : "false");
  document.getElementById("deck1").setAttribute("aria-selected", deckIdx === 1 ? "true" : "false");
}
document.getElementById("deck0").onclick = function(){ setDeck(0); };
document.getElementById("deck1").onclick = function(){ setDeck(1); };
deck.addEventListener("scroll", function(){
  var i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
  if (i !== deckIdx) { deckIdx = i; syncDeckBar(); }
}, {passive: true});

/* clicks on any item row, wherever it is */
document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest(".row[data-id]");
  if (b) openItem(b.getAttribute("data-id"));
});

/* the log is day-scoped, so a tab left open overnight has to notice the rollover */
var lastDay = dayKey();
setInterval(function(){
  if (dayKey() !== lastDay) { lastDay = dayKey(); tally(); }
}, 60000);

/* ------------------------------------------------------------------ boot */

fetch("data/foods.json?v=" + BUILD).then(function(r){
  if (!r.ok) throw new Error("foods.json " + r.status);
  return r.json();
}).then(function(db){
  D = db;
  NUT = D.nutrients;
  MEASURED = D.measured;
  decks[0] = D.venues.filter(function(v){ return v.kind === "ayce"; });
  decks[1] = D.venues.filter(function(v){ return v.kind !== "ayce"; });
  load();
  syncDeckBar();
  if (!who) openSetup(); else afterProfile();
  renderDeck(0); renderDeck(1); tally();
}).catch(function(e){
  document.querySelector(".deck").innerHTML =
    '<p class="empty">Could not load the food data (' + esc(e.message) +
    '). If you opened this file directly, serve the folder instead: ' +
    '<code>python3 -m http.server</code></p>';
});
</script>
</body>
</html>
