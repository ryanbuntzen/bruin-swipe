var DIET_BY_KEY = {};
DIETS.forEach(function(d){ DIET_BY_KEY[d.k] = d; });

/* ------------------------------------------------------------------ state */

var D = null;                 // the food database
var NUT = [], MEASURED = 0;
var people = {}, who = null;  // profiles
var decks = [[], []];         // venue lists: [ayce, pickup]
var sel = [0, 0];             // selected venue per deck
var day = [null, null];       // selected menu day per deck
var deckIdx = 0;
var recIds = {};              // item ids the recommender is pushing right now
var allMeals = false;         // show every meal period, not just the one you could walk into

function load(){
  try {
    var raw = JSON.parse(localStorage.getItem("bruinswipe") || "{}");
    people = raw.people || {};
    who = raw.who || null;
    allMeals = !!raw.allMeals;
    if (who && !people[who]) who = null;
  } catch (e) { people = {}; who = null; }
}
function save(){
  try { localStorage.setItem("bruinswipe", JSON.stringify({people:people, who:who, allMeals:allMeals})); }
  catch (e) {}
}
function me(){ return people[who] || {goal:2000, diets:[], log:{}, rules:[]}; }
function hasRule(k){ return isOwner(who) && (me().rules || []).indexOf(k) >= 0; }

// Per-nutrient target for the person eating.  The FDA's Daily Values assume a 2,000
// kcal day, so someone eating 3,100 needs proportionally more of anything the body
// spends alongside energy.  Opt-in, because it is a personal call, not label law.
function targets(){
  var goal = me().goal || 3100, t = {kcal: goal};
  var k = hasRule("scale") ? goal / 2000 : 1;
  Object.keys(DV).forEach(function(n){
    t[n] = DV[n] == null ? null : DV[n] * k;
  });
  // ceilings stay put: more calories is not a licence for more sodium or trans fat
  ["sodium", "satfat", "transfat", "addsugar", "chol"].forEach(function(n){
    if (DV[n] != null) t[n] = DV[n];
  });
  return t;
}

// YYYY-MM-DD for the eating day a moment belongs to
function dayKey(d){
  d = new Date(d || Date.now());
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}
function todayLog(){
  var p = me();
  if (!p.log) p.log = {};
  var k = dayKey();
  if (!p.log[k]) p.log[k] = [];
  // keep a fortnight; anything older is noise on a phone
  Object.keys(p.log).sort().slice(0, -14).forEach(function(old){ delete p.log[old]; });
  return p.log[k];
}

/* ------------------------------------------------------------------ meal plan

   Regular plans give n swipes a week and lose what is left when the week ends; Premier
   plans and the off-campus Bruin Meal Plan are one pot for the quarter. Counts are UCLA's
   Fall 2026 numbers (ask.housing.ucla.edu); other quarters differ, so "swipes left" is
   typed in at setup and counted down from there.                                       */

var PLANS = [
  {k:"none", n:"No meal plan"},
  {k:"19R", n:"19 Regular", week:19}, {k:"14R", n:"14 Regular", week:14},
  {k:"11R", n:"11 Regular", week:11},
  {k:"19P", n:"19 Premier", quarter:215}, {k:"14P", n:"14 Premier", quarter:158},
  {k:"11P", n:"11 Premier", quarter:128},
  {k:"BMP", n:"Bruin Meal Plan (off campus)", quarter:84}
];
var PLAN_END = "2026-12-11";   // Fall 2026's last contracted meal; editable per profile
var WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function keyDate(k){ var a = k.split("-"); return new Date(+a[0], a[1] - 1, +a[2], 12); }
function addDays(k, n){ var d = keyDate(k); d.setDate(d.getDate() + n); return dayKey(d); }
function weekdayOf(k){ return (keyDate(k).getDay() + 6) % 7; }       // Mon = 0
function planOf(){
  var k = me().plan || "none";
  return PLANS.filter(function(p){ return p.k === k; })[0] || PLANS[0];
}
function mealsOn(k){
  var m = me().meals;
  return m && m[weekdayOf(k)] != null ? m[weekdayOf(k)] : 3;
}
function swipesOn(k){
  return (me().swipes || []).filter(function(t){ return dayKey(t) === k; }).length;
}
// Swipes left in the current week (Regular) or quarter (Premier), and how many of them
// today can have. If the plan's meals-a-day would overspend what is left, today gets its
// fair share of the remainder instead -- 4 left over two 3-meal days is 2 a day.
// ponytail: the weekly reset is assumed to be Monday 5am; UCLA does not publish the day.
function budget(){
  var p = me(), plan = planOf(), today = dayKey();
  var used = swipesOn(today), L = Math.max(0, mealsOn(today) - used);
  var out = {plan: plan, used: used, planned: mealsOn(today), today: L, left: null};
  if (!plan.week && !plan.quarter) return out;
  var start = plan.week ? addDays(today, -weekdayOf(today)) : null;
  var end = plan.week ? addDays(start, 6) : (p.planEnd || PLAN_END);
  var s = p.swipes || [], a = p.left, left;
  if (a && (!start || dayKey(a.at) >= start))
    left = a.n - s.filter(function(t){ return t > a.at; }).length;
  else
    left = (plan.week || plan.quarter) - s.filter(function(t){ return !start || dayKey(t) >= start; }).length;
  left = Math.max(0, left);
  var F = 0;
  for (var k = addDays(today, 1); k <= end; k = addDays(k, 1)) F += mealsOn(k);
  out.left = left;
  out.today = left >= L + F ? L : Math.min(L, Math.round(left * L / Math.max(1, L + F)));
  return out;
}
// what one plate should come to: what is left of today's calories over the meals left today
function mealTarget(){
  var eaten = sumVecs(todayLog())[0];
  return Math.max(300, ((me().goal || 2000) - eaten) / Math.max(1, budget().today));
}
function useSwipe(){
  var p = me();
  p.swipes = (p.swipes || []).filter(function(t){ return Date.now() - t < 130 * 864e5; });
  p.swipes.push(Date.now());
}
// Logging food is a swipe used, once per meal period. Regular plans allow one entry a
// period, so that is the end of it; a Premier plan can swipe twice, so when food comes
// in well after the last log of an already-swiped meal, ask whether it was a new swipe.
var askTimer = null;
function swipeForMeal(){
  var p = me(), now = Date.now(), k = dayKey(now), m = mealAt(now);
  var had = (p.swipes || []).some(function(t){ return dayKey(t) === k && mealAt(t) === m; });
  var last = p.lastLog || 0;
  p.lastLog = now;
  if (!had) { useSwipe(); return; }
  if (!planOf().quarter || now - last < 20 * 60000) return;   // same sitting
  document.getElementById("swipeAskTxt").textContent =
    "You already swiped for " + (m === "Late" ? "late night" : m.toLowerCase()) + ". Was this a second swipe?";
  var el = document.getElementById("swipeAsk");
  el.hidden = false;
  clearTimeout(askTimer);
  askTimer = setTimeout(function(){ el.hidden = true; }, 15000);
}
function swipeLine(){
  var b = budget();
  if (b.left == null) return b.today + " meal" + (b.today === 1 ? "" : "s") + " left today";
  return b.left + " swipe" + (b.left === 1 ? "" : "s") + " left this " +
         (b.plan.week ? "week" : "quarter") + " · " + b.today + " for today";
}

/* ------------------------------------------------------------------ nutrition math */

function zero(){ return new Array(NUT.length).fill(0); }

function vecOf(entry){
  var out = zero(), it = D.items[entry.id];
  if (!it) return out;
  if (entry.comps) {                       // a build: sum its chosen components
    Object.keys(entry.comps).forEach(function(cid){
      var n = entry.comps[cid], c = D.items[cid];
      if (!n || !c || !c.v) return;
      for (var i = 0; i < NUT.length; i++) out[i] += (c.v[i] || 0) * n;
    });
  } else if (it.v) {
    for (var i = 0; i < NUT.length; i++) out[i] = it.v[i] || 0;
  }
  (entry.skip || []).forEach(function(k){
    var r = (D.removals || {})[k];
    if (!r) return;
    for (var i = 0; i < NUT.length; i++) out[i] = Math.max(0, out[i] - (r.v[i] || 0));
  });
  var q = entry.q == null ? 1 : entry.q;
  for (var j = 0; j < out.length; j++) out[j] *= q;
  return out;
}
function sumVecs(list){
  var out = zero();
  list.forEach(function(e){
    var v = vecOf(e);
    for (var i = 0; i < out.length; i++) out[i] += v[i];
  });
  return out;
}
function get(vec, key){
  var i = NUT.indexOf(key);
  return i < 0 ? 0 : vec[i];
}
function fmt(n, unit){
  if (n === 0) return "0" + unit;
  var a = Math.abs(n);
  var s = a < 1 ? n.toFixed(2) : (a < 10 ? n.toFixed(1) : Math.round(n).toString());
  return s.replace(/\.0+$/, "") + unit;
}
function isEstimated(key){ return NUT.indexOf(key) >= MEASURED; }

function nutTable(vec, opts){
  opts = opts || {};
  var T = targets();
  var anyEst = false;
  var html = '<table class="ntab">';
  SECTIONS.forEach(function(sec){
    html += '<tr><th colspan="2">' + sec[0] + '</th><th class="dv">%DV</th></tr>';
    sec[1].forEach(function(k){
      if (NUT.indexOf(k) < 0) return;
      var val = get(vec, k);
      if (!val && k !== "kcal" && !MAJOR[k]) return;          // skip empty trace rows
      var dv = T[k];
      var pct = dv ? Math.round(val / dv * 100) : null;
      var est = isEstimated(k);
      if (est) anyEst = true;
      html += '<tr' + (MAJOR[k] ? ' class="major"' : '') + '>' +
        '<td>' + LABEL[k] + (est ? '<span class="est" title="estimated from ingredients">est</span>' : '') + '</td>' +
        '<td class="v">' + fmt(val, UNIT[k]) + '</td>' +
        '<td class="dv">' + (pct == null ? "—" : pct + "%") +
          (pct == null ? "" : '<div class="dvbar"><i class="' + (pct > 100 ? "over" : "") +
            '" style="width:' + Math.min(100, pct) + '%"></i></div>') +
        '</td></tr>';
    });
  });
  // omega-3 to omega-6 balance: a ratio, so it needs its own row rather than a %DV
  var o3 = get(vec, "omega3_ala") + get(vec, "omega3_epa") + get(vec, "omega3_dha");
  var o6 = get(vec, "omega6");
  if (o3 > 0 || o6 > 0) {
    var r = o3 > 0 ? o6 / o3 : Infinity;
    var band = hasRule("omega");
    var good = r >= 1 && r <= 2;
    var txt = o3 > 0 ? "1 : " + (isFinite(r) ? r.toFixed(1) : "∞") : "no omega-3";
    html += '<tr><th colspan="2">Omega balance</th><th class="dv">' + (band ? "1:1–1:2" : "") + '</th></tr>' +
      '<tr class="major"><td>Omega-3 : Omega-6<span class="est">est</span></td>' +
      '<td class="v" style="color:' + (band ? (good ? "var(--ok)" : "var(--flag)") : "inherit") + '">' +
      txt + '</td><td class="dv">' + (band ? (good ? "in band" : "off") : "—") + '</td></tr>';
    anyEst = true;
  }
  html += "</table>";
  if (anyEst)
    html += '<p class="legend"><b>est</b> — UCLA publishes 19 nutrients per item. ' +
            'The rest are computed from its ingredient list: each ingredient matched to ' +
            'USDA SR Legacy, then the grams solved so the result reproduces UCLA\'s own ' +
            'published panel. Treat them as good estimates, not label data.</p>';
  return html;
}

/* ------------------------------------------------------------------ diet filter */

// Café 1919's undated menu lists every weekday's special ("Tue - Chicken Parmesan");
// only today's is actually on.
var WEEKDAY_ITEM = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s*-\s/;
function offToday(it){
  var m = WEEKDAY_ITEM.exec(it.n);
  return !!m && WEEKDAYS.indexOf(m[1]) !== weekdayOf(dayKey());
}

function blocked(it){
  var p = me();
  var d = (p.diets || []).filter(function(k){
    return !DIET_BY_KEY[k] || !DIET_BY_KEY[k].owner;   // owner diets are never ticked
  });
  if (isOwner(who)) d = d.concat(OWNER_DIETS);         // they just apply
  if (!d.length) return false;
  var hay = it.n + " " + (it.a || []).join(" ");
  for (var i = 0; i < DIETS.length; i++) {
    var D = DIETS[i];
    if (d.indexOf(D.k) < 0) continue;
    if (D.allow) {
      var n = it.n.replace(/sourdough( bread| toast| roll)?/ig, "sourdough");   // the one bread that is in
      if (D.meat.test(n)) { if (D.fused.test(n)) return true; continue; }
      if (D.greens && D.greens.test(n)) continue;
      if (D.deny.test(n)) return true;               // deny beats allow
      if (!D.allow.test(n)) return true;             // anything unnamed is out
      continue;
    }
    if (D.k === "vegetarian" && (it.t || []).indexOf("vegan") >= 0) continue;
    if (D.k === "vegetarian" && (it.t || []).indexOf("vegetarian") >= 0) continue;
    if (D.bad.test(hay)) return true;
  }
  return false;
}

/* ------------------------------------------------------------------ gap recommender

   Once something is logged, work out which nutrients are furthest behind for the day,
   then score every item by how much of that shortfall it closes per calorie.  Places
   are scored by their best few items, so the app can say "go to Bruin Plate" — and if
   you walk into De Neve instead, that hall's own best gap-fillers are still flagged.   */

// Nutrients worth chasing.  Ceilings (sodium, saturated fat, added sugar) are left out:
// falling short of those is the goal, not a gap.
var CHASE = ["protein","fiber","potassium","calcium","iron","magnesium","phosphorus","zinc",
             "copper","manganese","selenium","vit_a","vit_c","vit_d","vit_e","vit_k",
             "thiamin","riboflavin","niacin","vit_b6","folate","vit_b12","pantothenic",
             "choline","omega3_ala","omega3_epa","omega3_dha"];

// What the body actually takes up. The targets already assume a mixed diet, so only the
// plant forms that absorb far worse than that are marked down: iron from plants (the RDA
// for vegetarians is 1.8x), zinc from plants (phytates, up to 1.5x), and calcium from
// high-oxalate greens (~5% absorbed against ~30% from dairy). Vitamin A is published as
// RAE, which already counts carotene's poor conversion. Panels keep the label's numbers;
// this is only what the gap tracking and the plates count.
var PLANT_ONLY = {iron: 1 / 1.8, zinc: 1 / 1.5};
var OXALATE = /\b(spinach|chard|beet greens|rhubarb)\b/i;
function absorbed(v, it){
  if (!it || (it.t || []).indexOf("vegan") < 0) return v;
  var out = v.slice();
  Object.keys(PLANT_ONLY).forEach(function(k){
    var i = NUT.indexOf(k); if (i >= 0) out[i] *= PLANT_ONLY[k];
  });
  var c = NUT.indexOf("calcium");
  if (c >= 0 && OXALATE.test(it.n)) out[c] *= 5 / 30;
  return out;
}
function sumAbsorbed(list){
  var out = zero();
  list.forEach(function(e){
    var v = absorbed(vecOf(e), D.items[e.id]);
    for (var i = 0; i < out.length; i++) out[i] += v[i];
  });
  return out;
}

function gaps(){
  var log = todayLog();
  if (!log.length) return [];                       // nothing to advise on before the first meal
  var v = sumAbsorbed(log), T = targets(), out = [];
  CHASE.forEach(function(k){
    if (NUT.indexOf(k) < 0 || !T[k]) return;
    var got = get(v, k), frac = got / T[k];
    if (frac >= 0.95) return;
    out.push({k:k, frac:frac, missing:T[k] - got, target:T[k]});
  });
  // omega-3 counts as a gap when the ratio has drifted past 1:2
  if (hasRule("omega")) {
    var o3 = get(v, "omega3_ala") + get(v, "omega3_epa") + get(v, "omega3_dha");
    var o6 = get(v, "omega6");
    if (o3 > 0 && o6 / o3 > 2) out.push({k:"omega3_ala", frac:0.2, missing:o6 / 2 - o3,
                                         target:o6 / 2, ratio:true});
  }
  out.sort(function(a, b){ return a.frac - b.frac; });
  return out.slice(0, 8);
}

function scoreItem(it, gl){
  if (!it.v || !gl.length) return 0;
  var s = 0, av = absorbed(it.v, it);
  gl.forEach(function(g, i){
    var w = 1 - i / (gl.length + 1);                // the furthest-behind nutrient matters most
    var share = get(av, g.k) / Math.max(g.missing, 1e-9);
    s += w * Math.min(share, 1);
  });
  // per-calorie, so a 1,200 kcal platter does not win on bulk alone
  return s / (1 + (it.v[0] || 0) / 350);
}

// how much of today's shortfall a whole plate closes -- in total, not per calorie,
// because a swipe buys the plate, and juice only wins per calorie
function plateScore(plate, gl){
  var tot = zero();
  plate.picks.forEach(function(p){ for (var i = 0; i < tot.length; i++) tot[i] += p.av[i] * p.q; });
  return gl.reduce(function(s, g, i){
    return s + (1 - i / (gl.length + 1)) * Math.min(get(tot, g.k) / Math.max(g.missing, 1e-9), 1);
  }, 0);
}

// Where to send you. A hall swipe is the whole buffet, so an open hall wins; an open
// counter only wins when its one-entrée swipe actually covers the meal, otherwise the
// next hall meal does (a 790 kcal takeout plate is no answer to a 1,900 kcal dinner).
function covers(c){ return c.plate.kcal >= c.plate.target * 0.85; }
function gapPool(cands){
  function hall(c){ return c.v.kind === "ayce"; }
  function open(c){ return c.open; }
  return [cands.filter(hall).filter(open), cands.filter(open).filter(covers),
          cands.filter(hall), cands.filter(open), cands]
    .filter(function(l){ return l.length; })[0] || [];
}

function renderGaps(){
  var el = document.getElementById("gaps");
  var gl = gaps();
  if (!gl.length) { el.hidden = true; recIds = {}; return; }

  var cands = D.venues.map(function(v){
    var meals = v.menu[pickDay(v, day[v.kind === "ayce" ? 0 : 1])] || {};
    var meal = focusMeal(v, Object.keys(meals));
    if (!meal) return null;
    var plate = suggestPlate(meals[meal], 0, meal, v);
    if (!plate) return null;
    return {v: v, meal: meal, plate: plate, open: servingNow(v, meal), score: plateScore(plate, gl)};
  }).filter(Boolean);
  var ranked = gapPool(cands).sort(function(a, b){
    return (covers(b) - covers(a)) || b.score - a.score;     // enough food first, then the gaps
  });

  recIds = {};
  ranked.slice(0, 3).forEach(function(r){ r.plate.picks.forEach(function(p){ recIds[p.id] = 1; }); });

  var top = ranked[0];
  el.innerHTML = '<h3>Still short today</h3><div class="short">' +
    gl.slice(0, 5).map(function(g){
      return "<span>" + LABEL[g.k] + " " + Math.round(g.frac * 100) + "%" +
             (g.ratio ? " (ratio)" : "") + "</span>";
    }).join("") + "</div>" +
    (top
      ? "<p>Best place for that " + (top.open ? "right now" : "next") + ": <b>" + esc(top.v.n) +
        "</b> (" + esc(top.meal) + ") — " +
        top.plate.picks.slice(0, 4).map(function(p){ return esc(p.it.n); }).join(", ") +
        ".</p><button class=\"go\" type=\"button\" id=\"gapGo\">Show me</button>"
      : "<p>Everything is closed for the night.</p>");
  el.hidden = false;
  var go = document.getElementById("gapGo");
  if (go) go.onclick = function(){
    var v = top.v, di = v.kind === "ayce" ? 0 : 1;
    sel[di] = decks[di].indexOf(v);
    setDeck(di); renderDeck(di);
  };
}

/* ------------------------------------------------------------------ meal suggestion

   "What should I eat here" rather than "here are 300 items". Built from the menu that
   is actually up, so it stays right as the halls rotate, and shaped like a plate: a
   protein, a starch, fruit, something dairy, then topped up with more protein if the
   meal is still short. Respects the diet filter and leans toward whatever the day is
   behind on.                                                                          */

var CAT = [
  ["protein", /\b(egg|eggs|omelet|beef|steak|tri.?tip|sirloin|brisket|burger|cheeseburger|hamburger|patty|meatball|lamb|pork|bacon|ham|sausage|carnitas|chorizo|riblet|pastrami|gyudon|carne|chicken|turkey|fish|salmon|tuna|shrimp|cod|tilapia|katsu|tofu|tempeh)\b/i],
  ["carb",    /\b(rice|potato|yam|pasta|noodle|quinoa|bread|tortilla|oat|grain|farro|barley)\b/i],
  ["fruit",   /\b(fruit|apple|banana|orange|grape|melon|cantaloupe|watermelon|pineapple|mango|kiwi|berry|berries|strawberr|blueberr|peach|pear|plum|cherry)\b/i],
  ["dairy",   /\b(milk|yogurt|yoghurt|cottage|cheese)\b/i]
];
function catOf(name){
  for (var i = 0; i < CAT.length; i++) if (CAT[i][1].test(name)) return CAT[i][0];
  return "other";
}
function jitter(str, seed){          // stable pseudo-random so a plate does not reshuffle on every repaint
  var h = 2166136261 ^ seed;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

// A plate is a template with slots, not an optimiser. The owner's hand-built plans read
// well because they said "five eggs, two sausage links, a fruit bowl, a glass of milk" --
// so fill those same slots from whatever is on the menu today. Everyone else gets
// MyPlate's split: a protein, a grain, vegetables, fruit and dairy.
var MIXED = "pizza|lasagna|macaroni|pasta|sandwich|burger|wrap|quesadilla|burrito|bowl|cake|pancakes?|waffles?|muffin|bread|pie|crisp|cobbler|tart|cookies?|chips|soup|casserole|vinaigrette|dressing|sauce|syrup|jam|jelly|glaze";
var FRUIT_RE = new RegExp("^(?!.*\\b(links?|sausage|chicken|pork|turkey|juice|frozen|gelato|ice cream|tomato(es)?|" + MIXED + ")\\b).*" +
  "\\b(fruit|cantaloupe|watermelon|pineapple|melon|grapes?|banana|apple|orange|kiwi|mango|berr\\w*|smoothie)", "i");
var DAIRY_RE = /^(?!.*\b(frozen|bar|chocolate)\b).*\b(milk|yogurt|yoghurt|cottage|cheese)\b/i;
var MIXED_RE = new RegExp("\\b(" + MIXED + ")\\b", "i");
var PLATE_SLOTS = {
  Breakfast: [
    {n:"protein", re:/\b(egg|eggs|omelet|omelette|bacon|sausage|ham|turkey|tofu|chorizo)\b/i, q:1},
    {n:"grain",   re:/\b(oatmeal|oats|toast|bagel|pancake|waffle|bread|muffin|english muffin|granola|potato|hash brown|tortilla|biscuit)\b/i, q:1},
    {n:"fruit",   re:FRUIT_RE, q:1},
    {n:"dairy",   re:DAIRY_RE, q:1}
  ],
  Main: [
    {n:"protein", re:/\b(chicken|beef|steak|pork|turkey|fish|salmon|cod|tilapia|shrimp|tuna|lamb|tofu|tempeh|egg|eggs|beans?|lentils?|chickpeas?|falafel|meatballs?|burger|patty|carnitas|sausage)\b/i, q:1,
     not:new RegExp("\\b(" + MIXED + ")\\b", "i")},
    {n:"grain",   re:/\b(rice|pasta|noodles?|quinoa|bread|roll|tortilla|couscous|potato(es)?|farro|orzo|pita)\b/i, q:1,
     not:new RegExp("\\b(" + MIXED + "|chicken|beef|pork|shrimp|salmon|tofu|egg)\\b", "i")},
    {n:"veg",     re:/\b(broccoli|carrots?|green beans?|spinach|kale|salad|greens|vegetables?|veggies?|zucchini|squash|cauliflower|asparagus|brussels|cabbage|peas|corn|peppers?|tomato(es)?|cucumber|mushrooms?|eggplant|bok choy)\b/i, q:1,
     not:new RegExp("\\b(" + MIXED + "|chicken|beef|pork|shrimp|salmon)\\b", "i")},
    {n:"fruit",   re:FRUIT_RE, q:1},
    {n:"dairy",   re:DAIRY_RE, q:1}
  ]
};
var SLOTS = {
  Breakfast: [
    {n:"eggs",   re:/\b(fried egg|scrambled egg|hard cooked egg|poached egg|omelet|^egg)/i,
     units:5, cap:5, maxKcal:620,
     avoid:/white|vegan|plant|substitute|beyond/i,
     prefer:/^fried egg|hard cooked|poached egg/i},   // yolks are the point of the egg
    {n:"meat",   re:/\b(bacon|sausage|chorizo|ham|links|steak|carnitas|tri.?tip)\b/i,
     units:3, cap:3, maxKcal:320},
    {n:"fruit",  re:/\b(fruit|cantaloupe|watermelon|pineapple|melon|grape|banana|apple|orange|kiwi|mango|berr)/i, q:2, cap:4, maxKcal:170},
    {n:"dairy",  re:/\b(milk|yogurt|cottage|cheese)\b/i,                                    q:1, cap:2, maxKcal:260}
  ],
  // by weight, because that is how the plan reads: 7 oz of meat, 3 scoops of rice,
  // some fruit, a glass of milk and some yogurt. `grams` is the target; top-up may
  // run a slot to 1.6x it before the plate counts as full.
  Main: [
    {n:"meat",   re:/\b(beef|steak|tri.?tip|sirloin|brisket|burger|patty|lamb|pork|riblet|carnitas|chorizo|ribs|meatball|gyudon|carne|barbacoa|chicken|turkey|salmon|fish|shrimp|tuna|katsu|cod|tilapia|calamari|sausage|cheesesteak)\b/i, grams:198, q:1},
    {n:"starch", re:/\b(rice|sweet potato|yam)\b/i,                                         grams:237, q:3},
    {n:"fruit",  re:/^(?!.*\b(links?|sausage|chicken|pork|turkey|juice|frozen|gelato|ice cream)\b).*\b(fruit|cantaloupe|watermelon|pineapple|melon|grape|banana|apple|orange|kiwi|mango|berr|smoothie)/i, grams:150, q:1},
    {n:"milk",   re:/\bmilk\b(?!.*(chocolate|soy|oat|almond))/i,                             grams:240, q:1},
    {n:"yogurt", re:/^(?!.*\b(frozen|bar)\b).*\b(yogurt|yoghurt|cottage)\b/i,                  grams:170, q:1},
    {n:"greens", re:DIET_BY_KEY.animalfruit.greens,                                            grams:113, q:1}   // cooked greens: vitamin K and fiber
  ],
  Late: [
    {n:"main",   re:/\b(beef|steak|burger|patty|chicken|pork|bacon|sausage|egg|salmon|shrimp)\b/i, q:1, cap:3},
    {n:"starch", re:/\b(rice|sweet potato|yam|potato)\b/i,               q:1, cap:3, maxKcal:340},
    {n:"dairy",  re:/\b(milk|yogurt|cottage|cheese)\b/i,                                     q:1, cap:2}
  ]
};
// Which meal you could walk into right now. Dining halls run breakfast until about
// 10:30, lunch to 4, dinner to 9, and anything later is the late-night counter.
function mealAt(t){
  var d = new Date(t), h = d.getHours() + d.getMinutes() / 60;
  if (h < DAY_START_HOUR) return "Late";
  if (h < 10.5) return "Breakfast";
  if (h < 16) return "Lunch";
  if (h < 21) return "Dinner";
  return "Late";
}
function currentMeal(){ return mealAt(new Date()); }
function mealMatchesNow(meal){
  var now = currentMeal();
  if (now === "Late") return /late|night|all ?day/i.test(meal);
  return new RegExp(now === "Breakfast" ? "break|brunch" : now, "i").test(meal);
}

/* UCLA publishes real service windows, so prefer those over guessing from the clock. */
function nowMins(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function clock(m){
  m = ((m % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mi = m % 60, ap = h < 12 ? "am" : "pm";
  h = h % 12; if (!h) h = 12;
  return h + (mi ? ":" + String(mi).padStart(2, "0") : "") + ap;
}
function windowsFor(v){
  if (!v || !v.hours) return null;
  var days = Object.keys(v.hours).sort();
  return v.hours[dayKey()] || v.hours[days[days.length - 1]] || null;
}
function mealWindow(v, meal){
  var w = windowsFor(v);
  if (!w) return null;
  var keys = Object.keys(w);
  var key = keys.filter(function(k){ return k.toLowerCase() === String(meal).toLowerCase(); })[0];
  if (!key) key = keys.filter(function(k){
    return new RegExp(k.split(" ")[0], "i").test(meal) || new RegExp(meal.split(" ")[0], "i").test(k);
  })[0];
  if (!key) return null;
  var n = nowMins();
  return {key: key, from: w[key][0], to: w[key][1], open: n >= w[key][0] && n < w[key][1]};
}
// true when this hall is actually serving this meal right now; falls back to the clock
// for the few places UCLA publishes no hours for.
function servingNow(v, meal){
  if (/all ?day/i.test(meal)) {            // a counter's one menu: open whenever any window is
    var w = windowsFor(v), n = nowMins();
    return !w || Object.keys(w).some(function(k){ return n >= w[k][0] && n < w[k][1]; });
  }
  var mw = mealWindow(v, meal);
  return mw ? mw.open : mealMatchesNow(meal);
}
// one line for the hall header: what is open, or what opens next
function venueStatus(v){
  var w = windowsFor(v);
  if (!w) return "";
  var n = nowMins(), keys = Object.keys(w);
  for (var i = 0; i < keys.length; i++) {
    var a = w[keys[i]][0], b = w[keys[i]][1];
    if (n >= a && n < b) {
      var left = b - n;
      return keys[i] + " now · until " + clock(b) +
             (left <= 45 ? " · closes in " + left + " min" : "");
    }
  }
  var next = null;
  keys.forEach(function(k){
    if (w[k][0] > n && (!next || w[k][0] < w[next][0])) next = k;
  });
  if (next) {
    var wait = w[next][0] - n;
    return "Closed · " + next + " at " + clock(w[next][0]) +
           (wait <= 120 ? " · in " + (wait >= 60 ? Math.floor(wait / 60) + "h " : "") + (wait % 60) + "m" : "");
  }
  return "Closed for the day";
}

// UCLA's serving is not the unit anyone counts in: one "serving" of scrambled eggs is
// already about two eggs, so a slot asking for five means five eggs, not five servings.
function unitsPerServing(it){
  if (!it.p || !it.p[0] || !it.g) return 1;
  return Math.max(1, Math.round(it.g / it.p[0]));
}
function servingsForUnits(it, units){
  return Math.max(1, Math.round(units / unitsPerServing(it)));
}

// the meal you could walk into: the one being served, else the next to open today,
// else null -- a hall that is closed for the night has nothing to walk into
function focusMeal(v, keys){
  var now = keys.filter(function(m){ return servingNow(v, m); })[0];
  if (now) return now;
  if (!windowsFor(v)) {                    // no published hours: go by the clock
    var cur = ["Breakfast", "Lunch", "Dinner"].indexOf(currentMeal());
    return cur < 0 ? null : keys.filter(function(m){
      return [/break|brunch/i, /lunch/i, /dinner/i].some(function(re, i){ return i > cur && re.test(m); });
    })[0] || null;
  }
  var soon = null, bestStart = Infinity, n0 = nowMins();
  var w = windowsFor(v);
  keys.forEach(function(m){
    var mw = mealWindow(v, m);
    var from = mw ? mw.from : /all ?day/i.test(m)   // a counter's one menu opens with its first window
      ? Math.min.apply(null, Object.keys(w).map(function(k){ return w[k][0] > n0 ? w[k][0] : Infinity; }))
      : Infinity;
    if (from > n0 && from < bestStart) { bestStart = from; soon = m; }
  });
  return soon;
}

function slotsFor(meal){
  if (!isOwner(who)) return /break|brunch/i.test(meal) ? PLATE_SLOTS.Breakfast : PLATE_SLOTS.Main;
  if (/break|brunch/i.test(meal)) return SLOTS.Breakfast;
  if (/late|night/i.test(meal)) return SLOTS.Late;
  return SLOTS.Main;
}

// A plate entry's own panel: the item minus any wrapper the diet leaves on the tray.
function plateVec(rid, it, skip){
  return skip.length ? vecOf({id: rid, q: 1, skip: skip}) : it.v;
}
function plateQ(slot, it){
  if (slot.units) return servingsForUnits(it, slot.units);
  if (slot.grams && it.g) return Math.max(1, Math.round(slot.grams / it.g));
  return slot.q;
}

// A takeout swipe is one entrée and one side, except The Study, where it is an entrée,
// a drink and one piece of fruit. A handcrafted drink is a swipe on its own, so it is
// never part of a plate.
var SIDE_ST = /^sides?$/i;
var SWIPE_DRINK = /\b(milk|juice)\b/i, SWIPE_FRUIT = /\b(fruit|apple|banana|orange|kiwi|pear|grape|berr|melon)/i;
var SWIPE_PARTS = {"the-study-at-hedrick": ["drink", "fruit"]};
var NOT_ENTREE = /side|beverage|drink|coffee|\btea\b|espresso|kombucha|boba|dressing|sauce|topping|condiment|cake|pastr|gelato|cereal|^\W*$/i;
function swipePlate(pool, gl, seed, tK, vk){
  function best(ok, score){
    var b = null, bs = -Infinity;
    pool.forEach(function(p){
      if (!ok(p)) return;
      var sc = score(p) + jitter(p.id, seed);
      if (sc > bs) { bs = sc; b = p; }
    });
    return b;
  }
  var main = best(function(p){ return !NOT_ENTREE.test(p.station); },
                  function(p){ return get(p.v, "protein") + scoreItem(p.it, gl) * 20; });
  var sideScore = function(p){ return scoreItem(p.it, gl) * 20 + get(p.v, "protein") / 2; };
  var picks = [main].concat((SWIPE_PARTS[vk] || ["side"]).map(function(part){
    return best(function(p){
      if (!SIDE_ST.test(p.station) || p === main) return false;
      if (part === "drink") return SWIPE_DRINK.test(p.it.n);
      if (part === "fruit") return SWIPE_FRUIT.test(p.it.n) && !SWIPE_DRINK.test(p.it.n);
      return true;
    }, sideScore);
  })).filter(Boolean);
  if (!picks.length) return null;
  picks.forEach(function(p){ p.q = 1; });
  var kcal = picks.reduce(function(a, p){ return a + p.v[0]; }, 0);
  var prot = picks.reduce(function(a, p){ return a + get(p.v, "protein"); }, 0);
  return {picks: picks, kcal: kcal, prot: prot, target: tK};
}

var STACK = 3;                                // portions of one meat before a second one is preferred
function suggestPlate(rows, seed, meal, v){
  var gl = gaps();
  var swipe = v.kind === "pickup";
  var pool = [], seen = {};
  function add(rid, station){
    var it = D.items[rid];
    if (!it || !it.v || !it.v[0] || seen[rid] || it.batch || blocked(it) || offToday(it)) return;
    seen[rid] = 1;
    // the owner diet takes the bread off a meat sandwich, unless it is sourdough
    var skip = isOwner(who) && !/sourdough/i.test(it.n) ? (it.rm || []).slice() : [];
    var v = plateVec(rid, it, skip);
    pool.push({id: rid, it: it, v: v, av: absorbed(v, it), skip: skip, station: station});
  }
  rows.forEach(function(row){
    var it = D.items[row[1]];
    if (!it || /gelato|ice cream/i.test(row[0])) return;     // dessert counters are not a plate
    // a bar is its parts: the yogurt bar is the yogurt, the fruit and the cottage cheese on it
    if (it.b && !swipe) it.b.forEach(function(g){ g.forEach(function(cid){ add(cid, row[0] + " · " + it.n); }); });
    else add(row[1], row[0]);
  });
  if (!pool.length) return null;

  var tK = mealTarget();
  var ayce = v.kind === "ayce";
  var slots = slotsFor(meal || "");
  if (swipe) return swipePlate(pool, gl, seed, tK, v.k);
  var picks = [], kcal = 0, used = {};

  slots.forEach(function(slot){
    var best = null, bs = -Infinity;
    pool.forEach(function(p){
      if (used[p.id] || !slot.re.test(p.it.n) || (slot.not && slot.not.test(p.it.n))) return;
      if (p.v[0] * plateQ(slot, p.it) > tK * 0.8) return;   // every slot gets a turn; the trim below pays for it
      // the slots keep the plate balanced and on its macros; inside a slot, today's gaps
      // pick which meat, which fruit, which dairy -- weighed against protein density
      var sc = get(p.v, "protein") / Math.max(1, p.v[0] / 100)
             + scoreItem(p.it, gl) * 8 + jitter(p.id, seed);
      if (slot.avoid && slot.avoid.test(p.it.n)) sc -= 20;
      if (slot.prefer && slot.prefer.test(p.it.n)) sc += 6;
      if (sc > bs) { bs = sc; best = p; }
    });
    if (!best) return;
    used[best.id] = 1;
    best.q = plateQ(slot, best.it);
    if (slot.maxKcal && !ayce) {              // and never more than the slot is worth
      while (best.q > 1 && best.v[0] * best.q > slot.maxKcal) best.q -= 1;
    }
    best.slot = slot;
    picks.push(best);
    kcal += best.v[0] * best.q;
  });
  if (!picks.length) return null;

  // well over the target: take servings back off the sides, never the meat (a little over is fine)
  for (var trim = 0; trim < 30 && kcal > tK * 1.2; trim++) {
    var big = null;
    picks.forEach(function(p){
      if (p.q > 1 && p.slot.n !== "meat" && (!big || p.v[0] * p.q > big.v[0] * big.q)) big = p;
    });
    if (!big) break;
    big.q -= 1;
    kcal -= big.v[0];
  }

  // top up toward the calorie target, filling whichever slot is furthest under its own size
  // Top up toward the calorie target. Each extra serving goes to whatever closes the most
  // of this meal's share of the day's shortfall (protein and the micros) per calorie, so
  // the plate goes lopsided when one food fills a gap the others don't; once the gaps are
  // closed, it spreads evenly over the slots. A hall is all you can eat, so its slots have
  // no ceiling; only a counter's do.
  var dayV = sumAbsorbed(todayLog()), T = targets(), left = Math.max(1, budget().today);
  var need = {}, plateV = zero();
  CHASE.forEach(function(k){
    var i = NUT.indexOf(k);
    if (i >= 0 && T[k]) need[i] = Math.max(0, T[k] - dayV[i]) / left;
  });
  picks.forEach(function(p){ for (var i = 0; i < plateV.length; i++) plateV[i] += p.av[i] * p.q; });
  // A food's credit shrinks with its share of the plate, by calories and by weight, so it
  // only runs away with the plate when it fills a gap far better than the rest -- and a
  // low-calorie vegetable can't fill the plate with two kilos of itself.
  function grams(){ return picks.reduce(function(a, p){ return a + (p.it.g || 100) * p.q; }, 0); }
  function gain(p){                          // share of the remaining need one serving closes, per kcal
    var g = 0, share = p.v[0] * p.q / Math.max(1, kcal),
        heft = (p.it.g || 100) * p.q / Math.max(1, grams());
    for (var i in need) {
      if (!need[i]) continue;
      var rem = need[i] - plateV[i];
      if (rem > 0) g += Math.min(p.av[i], rem) / need[i];
    }
    // past STACK portions of one meat, each more counts for less, so a second meat
    // gets its turn; the meat still stacks when it is the only one that fills the gap
    var deep = p.slot === slots[0] && p.q >= STACK ? STACK / (p.q + 1) : 1;
    return g / p.v[0] * (1 - share) * (1 - heft) * (1 - heft) * deep;
  }
  for (var guard = 0; guard < 200 && kcal < tK * 0.92; guard++) {
    var pick = null, ps = -Infinity, gainPick = null, gs = 1e-3;
    picks.forEach(function(p){
      var cals = p.v[0], s = p.slot;
      if (cals <= 0 || kcal + cals > tK * 1.06) return;
      if (!ayce && s.grams && p.it.g) {
        if (p.it.g * (p.q + 1) > s.grams * 1.6) return;
      } else if (!ayce) {
        if (p.q >= (s.cap || 3)) return;
        if (s.maxKcal && cals * (p.q + 1) > s.maxKcal) return;
        if (s.units && unitsPerServing(p.it) * (p.q + 1) > s.units * 1.4) return;
      }
      var sc = s.grams && p.it.g ? -p.it.g * p.q / s.grams : -p.q;
      if (sc > ps) { ps = sc; pick = p; }
      var g = gain(p);
      if (g > gs) { gs = g; gainPick = p; }
    });
    pick = gainPick || pick;
    // the same meat 3 portions deep: put a second meat next to it if the hall has one
    var stacked = pick && pick.slot === slots[0] && pick.q >= STACK, more = null;
    if (!pick || stacked) {                   // every slot is full: open another of the first one
      var more = null, ms = -Infinity;
      pool.forEach(function(p){
        if (used[p.id] || !slots[0].re.test(p.it.n) || kcal + p.v[0] > tK * 1.06) return;
        if (slots[0].avoid && slots[0].avoid.test(p.it.n)) return;
        if (slots[0].not && slots[0].not.test(p.it.n)) return;
        if (stacked && MIXED_RE.test(p.it.n)) return;  // a lasagna or a soup is not a second meat
        var sc = get(p.v, "protein") / Math.max(1, p.v[0] / 100) + jitter(p.id, seed);
        if (sc > ms) { ms = sc; more = p; }
      });
      if (!more && !pick) break;
    }
    if (more && (!pick || stacked)) {
      used[more.id] = 1; more.q = 1; more.slot = slots[0];
      picks.push(more); kcal += more.v[0];
      for (var j = 0; j < plateV.length; j++) plateV[j] += more.av[j];
      continue;
    }
    pick.q += 1;
    kcal += pick.v[0];
    for (var j = 0; j < plateV.length; j++) plateV[j] += pick.av[j];
  }

  var prot = picks.reduce(function(a, p){ return a + get(p.v, "protein") * p.q; }, 0);
  return {picks: picks, kcal: kcal, prot: prot, target: tK};
}

var plateSeed = {};

function plateCard(v, meal, rows){
  var vkey = v.k, key = vkey + "|" + meal;
  var seed = plateSeed[key] || 0;
  var plate = suggestPlate(rows, seed, meal, v);
  if (!plate) return null;
  var sec = document.createElement("section");
  sec.className = "meal plate";
  sec.innerHTML =
    '<header><div><h3>Eat this' +
      (servingNow(v, meal) ? '<span class="nowpill">now</span>' : '') +
      '<small>a ' + Math.round(plate.kcal) + ' kcal plate, ' +
      Math.round(plate.prot) + ' g protein · ' + esc(swipeLine()) + '</small></h3></div>' +
    '<div class="mealkcal">' + Math.round(plate.kcal) + '<small>of ' +
      Math.round(plate.target) + '</small></div></header>' +
    '<ul class="items">' + plate.picks.map(function(p){
      var q = p.q || 1;
      return '<li><button class="row" data-id="' + p.id + '">' +
        '<span><span class="nm">' + esc(p.it.n) + '</span>' +
        '<span class="sub2">' + esc(portionText(p.it, q)) +
          (p.skip.length ? ' &middot; no ' + esc(p.skip.map(function(k){
            return ((D.removals || {})[k] || {label: k}).label.replace(/^the /, ""); }).join(", ")) : '') +
          ' &middot; ' + esc(p.station) + '</span></span>' +
        '<span class="kc">' + Math.round(p.v[0] * q) + '</span><span class="plus">+</span></button></li>';
    }).join("") + '</ul>' +
    '<div class="plateacts"><button type="button" class="btn ghost" data-shuffle="' + key + '">Different plate</button>' +
    '<button type="button" class="btn" data-logplate="' + key + '">Log the plate</button></div>';

  sec.querySelector("[data-shuffle]").onclick = function(){
    plateSeed[key] = seed + 1;
    renderDeck(decks[0].some(function(v){ return v.k === vkey; }) ? 0 : 1);
  };
  sec.querySelector("[data-logplate]").onclick = function(){
    plate.picks.forEach(function(p){
      var e = {id: p.id, q: p.q || 1};
      if (p.skip.length) e.skip = p.skip.slice();
      todayLog().push(e);
    });
    swipeForMeal();
    save(); tally(); renderDeck(0); renderDeck(1); openLog();
  };
  return sec;
}

/* ------------------------------------------------------------------ render: decks */

function menuDays(v){ return Object.keys(v.menu).sort(); }

function pickDay(v, want){
  var days = menuDays(v);
  if (days.indexOf(want) >= 0) return want;
  var t = dayKey();
  if (days.indexOf(t) >= 0) return t;
  if (days.indexOf("standing") >= 0) return "standing";
  return days[days.length - 1];
}

function renderDeck(di){
  var pane = document.getElementById("pane" + di);
  var tabs = pane.querySelector(".tabs");
  var h2 = pane.querySelector("h2");
  var daySel = pane.querySelector(".daypick");
  var menuEl = pane.querySelector(".menu");
  var list = decks[di];
  if (!list.length) { menuEl.innerHTML = '<p class="empty">Nothing published.</p>'; return; }

  tabs.innerHTML = "";
  list.forEach(function(v, i){
    var b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab");
    b.textContent = v.n;
    b.setAttribute("aria-selected", i === sel[di] ? "true" : "false");
    b.addEventListener("click", function(){ sel[di] = i; day[di] = null; renderDeck(di); });
    tabs.appendChild(b);
  });

  var v = list[sel[di]];
  h2.textContent = v.n;
  var noteEl = pane.querySelector(".vnote");
  if (!noteEl) {
    noteEl = document.createElement("p");
    noteEl.className = "vnote";
    pane.querySelector(".hallhead").insertAdjacentElement("afterend", noteEl);
  }
  var st = venueStatus(v);
  noteEl.innerHTML = (st ? '<span class="vstat' + (/ now ·/.test(st) ? " on" : "") + '">' +
                            esc(st) + "</span>" : "") +
                     (v.note ? (st ? " " : "") + esc(v.note) : "");
  noteEl.hidden = !st && !v.note;
  var d = day[di] = pickDay(v, day[di]);
  var days = menuDays(v);
  daySel.hidden = days.length < 2;
  daySel.innerHTML = days.map(function(x){
    var lbl = x === "standing" ? "Every day"
      : new Date(x + "T12:00").toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
    return '<option value="' + x + '"' + (x === d ? " selected" : "") + ">" + lbl + "</option>";
  }).join("");
  daySel.onchange = function(){ day[di] = daySel.value; renderDeck(di); };

  var meals = v.menu[d] || {};
  var order = ["Breakfast", "Brunch", "Lunch", "Dinner", "Allday", "All day"];
  var keys = Object.keys(meals).sort(function(a, b){
    var na = servingNow(v, a) ? 0 : 1, nb = servingNow(v, b) ? 0 : 1;
    if (na !== nb) return na - nb;            // whatever is being served now goes first
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  menuEl.innerHTML = "";

  // one suggestion per hall, for the meal you could actually walk into
  var focus = focusMeal(v, keys);
  // today shows only that meal: breakfast from 5am until it ends, then lunch, then dinner
  var periods = d === dayKey() && keys.length > 1;
  if (periods && !allMeals) keys = focus ? [focus] : [];

  keys.forEach(function(meal){
    var byStation = {};
    meals[meal].forEach(function(row){
      (byStation[row[0]] = byStation[row[0]] || []).push(row[1]);
    });
    var shown = 0, hidden = 0, inner = "";
    Object.keys(byStation).forEach(function(st){
      var rows = "";
      byStation[st].forEach(function(rid){
        var it = D.items[rid];
        if (!it || offToday(it)) return;
        if (blocked(it)) { hidden++; return; }
        shown++;
        rows += '<li><button class="row" data-id="' + rid + '">' +
          '<span><span class="nm">' + esc(it.n) +
            (it.b ? '<span class="bpill">build</span>' : '') +
            (recIds[rid] ? '<span class="badge">fills a gap</span>' : '') + '</span>' +
            '<span class="sub2">' + (it.v ? esc(portionText(it, 1)) : "choose components") +
              ' &middot; ' + esc(st) + '</span></span>' +
          '<span class="kc">' + (it.v ? Math.round(it.v[0]) : "—") +
            '<em>' + (it.v ? "P" + Math.round(get(it.v, "protein")) +
                             " F" + Math.round(get(it.v, "fat")) +
                             " C" + Math.round(get(it.v, "carb")) : "build") + '</em></span>' +
          '<span class="plus">+</span></button></li>';
      });
      if (rows) inner += '<div class="stationrow">' + esc(st) + '</div><ul class="items">' + rows + '</ul>';
    });
    if (!shown) return;
    if (meal === focus) {
      var card = plateCard(v, meal, meals[meal]);
      if (card) menuEl.appendChild(card);
    }
    var sec = document.createElement("section");
    sec.className = "meal";
    sec.innerHTML = '<header><h3>' + esc(meal) +
      (servingNow(v, meal) ? '<span class="nowpill">now</span>' : '') +
      '<small>' + shown + ' items' +
      (hidden ? " · " + hidden + " hidden by diet" : "") + '</small></h3></header>' + inner;
    menuEl.appendChild(sec);
  });
  if (!menuEl.children.length) menuEl.innerHTML = '<p class="empty">' +
    (periods && !allMeals ? "Closed for the night." : "Nothing on this day\'s menu.") + "</p>";
  if (periods) {
    var tg = document.createElement("button");
    tg.type = "button"; tg.className = "go";
    tg.textContent = allMeals ? "Only the current meal" : "Show all meals today";
    tg.onclick = function(){ allMeals = !allMeals; save(); renderDeck(di); };
    menuEl.appendChild(tg);
  }
}

// UCLA publishes "3.29oz", which is useless in line. Each item carries the unit it is
// naturally counted in, so weight x servings becomes "5 eggs" or "3 scoops = 1 cup".
function cups(g, perCup){
  var c = g / (perCup || 150);
  if (c < 0.4) return Math.round(g) + " g";
  if (c < 0.6) return "\u00bd cup";
  if (c < 0.9) return "\u00be cup";
  if (c < 1.35) return "1 cup";
  return (Math.round(c * 2) / 2) + " cups";
}
function portionText(it, q){
  q = q || 1;
  var p = it.p;
  if (!p) return it.s ? (q > 1 ? q + " \u00d7 " + it.s : it.s) : "";
  var style = p[3], g = (it.g || 0) * q;
  if (style === "whole") {
    if (p[1] === "medium") return q + " medium";
    return q > 1 ? q + " of them" : "the whole thing";
  }
  if (style === "piece") {
    var np = q % 1 ? q : Math.round(q);
    return np + (np === 1 ? " piece \u00b7 about a palm" : " pieces");
  }
  if (!p[0]) return it.s || "";
  // count one serving, then multiply -- rounding the scaled weight drifts (5 x 2 eggs
  // came out as 11)
  var per = Math.max(1, Math.round((it.g || 0) / p[0]));
  var n = q % 1 ? Math.max(1, Math.round(per * q)) : per * q;
  var label = n === 1 ? p[1] : p[2];
  if (style === "worth") return n + " " + label + "\u2019 worth";
  if (style === "handful") return "\u2248 " + n + " " + label + " \u00b7 a cupped handful";
  if (style === "cup")     return "\u2248 " + n + " " + label + " \u00b7 " + cups(g, 150);
  if (style === "halfcup") return n + " " + label + " \u00b7 " + cups(g, 226);
  if (style === "rice")    return n + " " + label + " \u2248 " + cups(g, 158);
  if (style === "basket")  return "\u2248 " + n + " " + label;
  return n + " " + label;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c];
  });
}

/* ------------------------------------------------------------------ item sheet */

var cur = null;   // {id, q, comps}
var itemSheet = document.getElementById("itemSheet");

function openItem(rid){
  var it = D.items[rid];
  if (!it) return;
  cur = {id: rid, q: 1, comps: null, skip: []};
  if (it.b) {
    cur.comps = {};
    // start with nothing selected; the first group is usually the base
    it.b.forEach(function(g){ g.forEach(function(cid){ cur.comps[cid] = 0; }); });
  }
  document.getElementById("itemTitle").textContent = it.n;
  var wh = [];
  (D.venues || []).forEach(function(v){
    Object.keys(v.menu).forEach(function(d){
      Object.keys(v.menu[d]).forEach(function(m){
        v.menu[d][m].forEach(function(row){
          if (row[1] === rid && wh.indexOf(v.n + " · " + row[0]) < 0) wh.push(v.n + " · " + row[0]);
        });
      });
    });
  });
  var whEl = document.getElementById("itemWhere");
  whEl.textContent = wh.slice(0, 3).join("   ");
  if (it.batch) {
    whEl.innerHTML = esc(wh.slice(0, 2).join("   ")) +
      '<span class="warnline">UCLA lists this at ' + esc(it.s || "") +
      ' — that is the batch the kitchen makes, not a plate. Dial the servings down to ' +
      'the fraction you actually take.</span>';
  }
  if (it.note) {
    whEl.innerHTML = esc(wh.slice(0, 2).join("   ")) + '<span class="warnline">' + esc(it.note) + '</span>';
  }
  if (it.src === "reconstructed") {
    whEl.innerHTML = esc(wh.slice(0, 2).join("   ")) +
      '<span class="warnline">Nobody publishes a panel for a food truck. ' +
      'Every number here is reconstructed from the vendor\'s own description of the item' +
      (it.d ? " — " + esc(it.d) : "") + ', priced against USDA. Treat it as a ballpark.</span>';
  }
  document.getElementById("itemServing").textContent =
    it.s ? ("One serving: " + it.s + (it.g ? " (" + it.g + " g)" : "")) : "";
  renderItem();
  itemSheet.hidden = false;
}

function renderItem(){
  var it = D.items[cur.id];
  var bEl = document.getElementById("itemBuild");
  if (cur.comps) {
    var html = "";
    it.b.forEach(function(g, gi){
      html += '<div class="grp">' + (gi === 0 ? "Base" : "Add") + '</div>';
      g.forEach(function(cid){
        var c = D.items[cid];
        if (!c) return;
        var n = cur.comps[cid] || 0;
        html += '<div class="comp">' +
          '<span>' + esc(c.n) + '<span class="n2">' +
            (c.s ? esc(c.s) + " · " : "") + (c.v ? Math.round(c.v[0]) + " kcal" : "no data") +
          '</span></span>' +
          '<span class="qty"><button type="button" data-cm="' + cid + '">−</button>' +
            '<span>' + n + '</span>' +
            '<button type="button" data-cp="' + cid + '">+</button></span>' +
        '</div>';
      });
    });
    bEl.innerHTML = html;
    bEl.querySelectorAll("[data-cp]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-cp");
        cur.comps[id] = Math.min(10, (cur.comps[id] || 0) + 1);
        renderItem();
      };
    });
    bEl.querySelectorAll("[data-cm]").forEach(function(b){
      b.onclick = function(){
        var id = b.getAttribute("data-cm");
        cur.comps[id] = Math.max(0, (cur.comps[id] || 0) - 1);
        renderItem();
      };
    });
  } else {
    bEl.innerHTML = "";
  }
  var g = D.items[cur.id].g;
  var rmEl = document.getElementById("itemRemove");
  if (it.rm && it.rm.length && D.removals) {
    rmEl.innerHTML = '<div class="grp">Leaving anything?</div>' + it.rm.map(function(k){
      var r = D.removals[k];
      if (!r) return "";
      var on = cur.skip.indexOf(k) >= 0;
      return '<button type="button" class="skipbtn' + (on ? " on" : "") + '" data-skip="' + k + '">' +
        (on ? "\u2713 skipping " : "Skip ") + esc(r.label) +
        ' <span>&minus;' + Math.round(r.v[0]) + ' kcal</span></button>';
    }).join("");
    rmEl.querySelectorAll("[data-skip]").forEach(function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-skip"), i = cur.skip.indexOf(k);
        if (i < 0) cur.skip.push(k); else cur.skip.splice(i, 1);
        renderItem();
      };
    });
  } else {
    rmEl.innerHTML = "";
  }
  document.getElementById("qVal").textContent =
    (cur.q === 0.5 ? "½" : cur.q) + (cur.q === 1 ? " serving" : " servings") +
    (g ? "  ·  " + Math.round(g * cur.q) + " g" : "");
  document.getElementById("itemNut").innerHTML = nutTable(vecOf(cur));
}

document.getElementById("qPlus").onclick = function(){
  cur.q = cur.q < 1 ? 1 : cur.q + 1; renderItem();
};
document.getElementById("qMinus").onclick = function(){
  var steps = [0.05, 0.1, 0.25, 0.5, 1];      // batch-sized items need small fractions
  if (cur.q > 1) { cur.q -= 1; }
  else {
    var i = steps.indexOf(cur.q);
    cur.q = i > 0 ? steps[i - 1] : (cur.q > 0.5 ? 0.5 : steps[0]);
  }
  renderItem();
};
document.getElementById("itemClose").onclick = function(){ itemSheet.hidden = true; };
document.getElementById("itemAdd").onclick = function(){
  var e = {id: cur.id, q: cur.q};
  if (cur.skip && cur.skip.length) e.skip = cur.skip.slice();
  if (cur.comps) {
    var picked = {};
    Object.keys(cur.comps).forEach(function(k){ if (cur.comps[k]) picked[k] = cur.comps[k]; });
    if (!Object.keys(picked).length) return;       // nothing chosen yet
    e.comps = picked;
  }
  todayLog().push(e);
  swipeForMeal();
  save(); tally(); renderDeck(0); renderDeck(1);
  itemSheet.hidden = true;
};
itemSheet.onclick = function(ev){ if (ev.target === itemSheet) itemSheet.hidden = true; };

/* ------------------------------------------------------------------ today sheet */

var logSheet = document.getElementById("logSheet");

function openLog(){
  var log = todayLog();
  var d = new Date();
  document.getElementById("logSub").textContent =
    new Date(dayKey() + "T12:00").toLocaleDateString(undefined,
      {weekday:"long", month:"long", day:"numeric"}) +
    " · rolls over at 5am" + (d.getHours() < DAY_START_HOUR ? " (still last night)" : "");
  var el = document.getElementById("logList");
  if (!log.length) {
    el.innerHTML = '<p class="empty">Nothing logged yet. Tap any item to add it.</p>';
  } else {
    el.innerHTML = log.map(function(e, i){
      var it = D.items[e.id] || {n:"(gone)"};
      var v = vecOf(e);
      var extra = e.comps ? Object.keys(e.comps).map(function(c){
        return (D.items[c] || {n:"?"}).n + (e.comps[c] > 1 ? " ×" + e.comps[c] : "");
      }).join(", ") : "";
      if (e.skip && e.skip.length) {
        extra += (extra ? " \u00b7 " : "") + "no " + e.skip.map(function(k){
          return ((D.removals || {})[k] || {label: k}).label.replace(/^the /, "");
        }).join(", no ");
      }
      return '<div class="logrow"><span>' + esc(it.n) +
        (e.q !== 1 ? " ×" + e.q : "") +
        (extra ? '<span class="n2" style="display:block;font-size:11px;color:var(--ink-3)">' +
                 esc(extra) + "</span>" : "") +
        '</span><span style="font-variant-numeric:tabular-nums">' + Math.round(v[0]) + '</span>' +
        '<button class="x" type="button" data-rm="' + i + '" aria-label="Remove">×</button></div>';
    }).join("");
    el.querySelectorAll("[data-rm]").forEach(function(b){
      b.onclick = function(){
        todayLog().splice(+b.getAttribute("data-rm"), 1);
        save(); tally(); renderDeck(0); renderDeck(1); openLog();
      };
    });
  }
  var sr = document.getElementById("swipeRow");
  sr.innerHTML = '<span>' + esc(swipeLine()) + '</span>' +
    '<button class="btn ghost" type="button" id="swipeLess" aria-label="Take back a swipe">−</button>' +
    '<button class="btn ghost" type="button" id="swipeMore" aria-label="Used a swipe">+ swipe</button>';
  document.getElementById("swipeMore").onclick = function(){ useSwipe(); save(); tally(); renderDeck(0); renderDeck(1); openLog(); };
  document.getElementById("swipeLess").onclick = function(){
    (me().swipes || []).pop(); save(); tally(); renderDeck(0); renderDeck(1); openLog();
  };
  document.getElementById("logNut").innerHTML = nutTable(sumVecs(log));
  logSheet.hidden = false;
}
document.getElementById("logClose").onclick = function(){ logSheet.hidden = true; };
document.getElementById("logClear").onclick = function(){
  if (!todayLog().length) { logSheet.hidden = true; return; }
  me().log[dayKey()] = [];
  save(); tally(); openLog();
};
logSheet.onclick = function(ev){ if (ev.target === logSheet) logSheet.hidden = true; };
document.getElementById("total").onclick = openLog;
document.getElementById("askSame").onclick = function(){ document.getElementById("swipeAsk").hidden = true; };
document.getElementById("askNew").onclick = function(){
  useSwipe(); save(); tally(); renderDeck(0); renderDeck(1);
  document.getElementById("swipeAsk").hidden = true;
};

/* ------------------------------------------------------------------ tally bar */

function tally(){
  var v = sumVecs(todayLog()), goal = me().goal || 2000;
  document.getElementById("tKcal").textContent = Math.round(v[0]).toLocaleString();
  document.getElementById("tGoal").textContent = goal.toLocaleString();
  document.getElementById("tP").textContent = Math.round(get(v, "protein")) + "g";
  document.getElementById("tF").textContent = Math.round(get(v, "fat")) + "g";
  document.getElementById("tC").textContent = Math.round(get(v, "carb")) + "g";
  document.getElementById("barFill").style.width = Math.min(100, v[0] / goal * 100) + "%";
  document.getElementById("barMark").style.left = "100%";
  renderGaps();
  var n = todayLog().length;
  document.getElementById("tallyLbl").textContent =
    (n ? n + " item" + (n > 1 ? "s" : "") + " today" : "Today") + " · " + swipeLine().replace(" this week", "").replace(" this quarter", "");
}

/* ------------------------------------------------------------------ search */

var qEl = document.getElementById("q"), resEl = document.getElementById("results");
qEl.addEventListener("input", function(){
  var q = qEl.value.trim().toLowerCase();
  if (q.length < 2) { resEl.innerHTML = ""; return; }
  var hits = [];
  for (var rid in D.items) {
    var it = D.items[rid];
    if (it.n.toLowerCase().indexOf(q) < 0) continue;
    hits.push([rid, it, blocked(it)]);
    if (hits.length > 60) break;
  }
  hits.sort(function(a, b){ return a[1].n.length - b[1].n.length; });
  resEl.innerHTML = hits.slice(0, 30).map(function(h){
    return '<li><button class="row" data-id="' + h[0] + '">' +
      '<span><span class="nm">' + esc(h[1].n) + (h[1].b ? '<span class="bpill">build</span>' : '') +
      (h[2] ? '<span class="offdiet">off diet</span>' : '') +
      '</span><span class="sub2">' + (h[1].s ? esc(h[1].s) : "choose components") + '</span></span>' +
      '<span class="kc">' + (h[1].v ? Math.round(h[1].v[0]) : "—") + '</span>' +
      '<span class="plus">+</span></button></li>';
  }).join("");
});

/* ------------------------------------------------------------------ profiles */

var setupEl = document.getElementById("setup");
var fName = document.getElementById("fName"), fGoal = document.getElementById("fGoal");
var fDiets = document.getElementById("fDiets"), peopleEl = document.getElementById("people");
var fPlan = document.getElementById("fPlan"), fLeft = document.getElementById("fLeft");
var fEnd = document.getElementById("fEnd"), fMeals = document.getElementById("fMeals");
fPlan.innerHTML = PLANS.map(function(p){ return '<option value="' + p.k + '">' + esc(p.n) + '</option>'; }).join("");
fMeals.innerHTML = WEEKDAYS.map(function(d, i){
  return '<label>' + d + '<input type="number" inputmode="numeric" min="0" max="5" step="1" data-day="' + i + '"></label>';
}).join("");
function paintPlanFields(){
  var plan = PLANS.filter(function(p){ return p.k === fPlan.value; })[0] || PLANS[0];
  document.getElementById("fLeftWrap").hidden = !plan.week && !plan.quarter;
  document.getElementById("fEndWrap").hidden = !plan.quarter;
  document.getElementById("fLeftLbl").textContent =
    plan.week ? "Swipes left this week" : "Swipes left this quarter";
  fLeft.placeholder = plan.week || plan.quarter || "";
}
fPlan.onchange = function(){ fLeft.value = ""; paintPlanFields(); };
function fillPlan(p){
  fPlan.value = (p && p.plan) || "none";
  fEnd.value = (p && p.planEnd) || PLAN_END;
  var m = (p && p.meals) || [3, 3, 3, 3, 3, 3, 3];
  fMeals.querySelectorAll("input").forEach(function(i){ i.value = m[+i.getAttribute("data-day")]; });
  fLeft.value = "";
  if (p && p.plan && p.plan !== "none") {        // what the counter says now, under the profile's own plan
    var keep = who; who = editing; fLeft.value = budget().left; who = keep;
  }
  paintPlanFields();
}
var editing = null;

function paintDietOptions(name){
  fDiets.innerHTML = "";
  DIETS.forEach(function(d){
    if (d.owner) return;        // applies automatically to its owner, never a checkbox
    var l = document.createElement("label");
    l.innerHTML = '<input type="checkbox" value="' + d.k + '"> ' + d.n;
    fDiets.appendChild(l);
  });
}
var RULES = [
  {k:"scale", n:"Scale nutrient targets to my calories"},
  {k:"omega", n:"Hold omega-3:6 between 1:1 and 1:2"}
];
var fRules = document.getElementById("fRules");
function paintRuleOptions(name){
  fRules.innerHTML = "";
  RULES.forEach(function(r){
    var l = document.createElement("label");
    l.innerHTML = '<input type="checkbox" value="' + r.k + '"> ' + r.n;
    fRules.appendChild(l);
  });
  fRules.parentNode.hidden = !isOwner(name);
}

function openSetup(name){
  editing = name || null;
  peopleEl.innerHTML = "";
  Object.keys(people).forEach(function(n){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    if (n === who) b.className = "on";
    b.onclick = function(){ who = n; save(); afterProfile(); setupEl.hidden = true; };
    peopleEl.appendChild(b);
  });
  var add = document.createElement("button");
  add.type = "button"; add.textContent = "+ new";
  add.onclick = function(){ editing = null; fName.value = ""; fGoal.value = ""; setDiets([]); fillPlan(null); };
  peopleEl.appendChild(add);

  var p = editing ? people[editing] : null;
  paintDietOptions(editing);
  paintRuleOptions(editing);
  fName.value = editing || "";
  fGoal.value = p ? p.goal : "";
  setDiets(p ? (p.diets || []) : []);
  setRules(p ? (p.rules || []) : []);
  fillPlan(p);
  document.getElementById("setupDel").hidden = !editing;
  setupEl.hidden = false;
}
function setDiets(list){
  fDiets.querySelectorAll("input").forEach(function(i){ i.checked = list.indexOf(i.value) >= 0; });
}
function setRules(list){
  fRules.querySelectorAll("input").forEach(function(i){ i.checked = list.indexOf(i.value) >= 0; });
}
fName.addEventListener("input", function(){
  var keepD = [], keepR = [];
  fDiets.querySelectorAll("input").forEach(function(i){ if (i.checked) keepD.push(i.value); });
  fRules.querySelectorAll("input").forEach(function(i){ if (i.checked) keepR.push(i.value); });
  paintDietOptions(fName.value);
  paintRuleOptions(fName.value);
  setDiets(keepD); setRules(keepR);
});

document.getElementById("setupSave").onclick = function(){
  var name = fName.value.trim() || "Me";
  var goal = Math.max(800, Math.min(8000, parseInt(fGoal.value, 10) || 2000));
  var diets = [];
  fDiets.querySelectorAll("input").forEach(function(i){ if (i.checked) diets.push(i.value); });
  var rules = [];
  fRules.querySelectorAll("input").forEach(function(i){ if (i.checked) rules.push(i.value); });
  var old = (editing && people[editing]) || {};
  var meals = [];
  fMeals.querySelectorAll("input").forEach(function(i){
    var n = parseInt(i.value, 10);
    meals[+i.getAttribute("data-day")] = isNaN(n) ? 3 : Math.max(0, Math.min(5, n));
  });
  var rec = {goal: goal, diets: diets, rules: rules, log: old.log || {}, swipes: old.swipes || [],
             plan: fPlan.value, meals: meals, planEnd: fEnd.value || PLAN_END};
  // the typed count is the truth as of now; blank means count from the plan's full allowance
  var left = parseInt(fLeft.value, 10);
  if (!isNaN(left)) rec.left = {n: Math.max(0, left), at: Date.now()};
  else if (old.plan === rec.plan && old.left) rec.left = old.left;
  if (editing && editing !== name) delete people[editing];
  people[name] = rec;
  who = name;
  save(); afterProfile(); setupEl.hidden = true;
};
document.getElementById("setupDel").onclick = function(){
  if (editing) delete people[editing];
  who = Object.keys(people)[0] || null;
  save();
  if (!who) openSetup(); else { afterProfile(); setupEl.hidden = true; }
};
document.getElementById("who").onclick = function(){ openSetup(who); };
setupEl.onclick = function(ev){ if (ev.target === setupEl && who) setupEl.hidden = true; };

function afterProfile(){
  document.getElementById("who").textContent = who ? who + " · " + (me().goal || 3100) : "set up";
  renderDeck(0); renderDeck(1); tally();
}

/* ------------------------------------------------------------------ deck swipe */

var deck = document.getElementById("deck");
function setDeck(i){
  deckIdx = i;
  deck.scrollTo({left: i * deck.clientWidth, behavior: "smooth"});
  syncDeckBar();
}
function syncDeckBar(){
  document.getElementById("deck0").setAttribute("aria-selected", deckIdx === 0 ? "true" : "false");
  document.getElementById("deck1").setAttribute("aria-selected", deckIdx === 1 ? "true" : "false");
  document.getElementById("pane0").classList.toggle("off", deckIdx !== 0);
  document.getElementById("pane1").classList.toggle("off", deckIdx !== 1);
}
document.getElementById("deck0").onclick = function(){ setDeck(0); };
document.getElementById("deck1").onclick = function(){ setDeck(1); };
deck.addEventListener("scroll", function(){
  var i = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
  if (i !== deckIdx) { deckIdx = i; syncDeckBar(); }
}, {passive: true});

/* clicks on any item row, wherever it is */
document.addEventListener("click", function(ev){
  var b = ev.target.closest && ev.target.closest(".row[data-id]");
  if (b) openItem(b.getAttribute("data-id"));
});

/* the log is day-scoped, so a tab left open overnight has to notice the rollover */
var lastDay = dayKey();
setInterval(function(){
  if (dayKey() !== lastDay) { lastDay = dayKey(); tally(); }
}, 60000);

/* ------------------------------------------------------------------ boot */

fetch("build.json", {cache: "no-store"})
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(b){
    if (b && b.build && b.build !== BUILD && !sessionStorage.getItem("reloaded-" + b.build)) {
      try { sessionStorage.setItem("reloaded-" + b.build, "1"); } catch (e) {}
      location.reload();
      throw new Error("reloading for " + b.build);
    }
  })
  .catch(function(){})
  .then(function(){ return fetch("data/foods.json?v=" + BUILD); }).then(function(r){
  if (!r.ok) throw new Error("foods.json " + r.status);
  return r.json();
}).then(function(db){
  D = db;
  NUT = D.nutrients;
  MEASURED = D.measured;
  decks[0] = D.venues.filter(function(v){ return v.kind === "ayce"; });
  decks[1] = D.venues.filter(function(v){ return v.kind !== "ayce"; });
  load();
  syncDeckBar();
  if (!who) openSetup(); else afterProfile();
  renderDeck(0); renderDeck(1); tally();
}).catch(function(e){
  document.querySelector(".deck").innerHTML =
    '<p class="empty">Could not load the food data (' + esc(e.message) +
    '). If you opened this file directly, serve the folder instead: ' +
    '<code>python3 -m http.server</code></p>';
});
</script>
</body>
</html>
