<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bruin Swipe Card</title>
<meta name="description" content="Log what you eat at UCLA dining and see the full nutrient panel: calories, macros and 39 micronutrients.">
<meta name="theme-color" content="#14202c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bruin Swipe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#e9edf2; --card:#ffffff; --card-2:#f4f7fa;
  --ink:#14202c; --ink-2:#556879; --ink-3:#8496a5;
  --line:#d3dde6; --line-soft:#e4ebf1;
  --accent:#9a5c0a; --accent-soft:#f7ead6;
  --blue:#1f5379; --flag:#9c3226; --flag-soft:#f7e2de; --ok:#2c6249;
  --r:10px; --r-s:6px; --r-xs:3px; --tally:#14202c; --tally-ink:#e9edf2; --shadow:0 1px 2px rgba(20,32,44,.06),0 2px 8px rgba(20,32,44,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e151d; --card:#161f29; --card-2:#1c2733;
    --ink:#e7edf3; --ink-2:#9dafbd; --ink-3:#71838f;
    --line:#2a3743; --line-soft:#212d38;
    --accent:#e5a75a; --accent-soft:#3a2c17;
    --blue:#7db3d8; --flag:#e08a7c; --flag-soft:#37211d; --ok:#74bb9b;
    --shadow:none; --tally:#070c11;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e151d; --card:#161f29; --card-2:#1c2733;
  --ink:#e7edf3; --ink-2:#9dafbd; --ink-3:#71838f;
  --line:#2a3743; --line-soft:#212d38;
  --accent:#e5a75a; --accent-soft:#3a2c17;
  --blue:#7db3d8; --flag:#e08a7c; --flag-soft:#37211d; --ok:#74bb9b;
  --shadow:none; --tally:#070c11;
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;margin:0}
.wrap{max-width:600px;margin:0 auto;min-width:0;overflow-x:hidden;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(128px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

h1{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:28px;letter-spacing:.01em;
  line-height:.95;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  font:inherit;font-size:12px;padding:6px 11px;border-radius:var(--r-s);cursor:pointer;white-space:nowrap}
.who:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* search */
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 13px;box-shadow:var(--shadow);border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.results{list-style:none;margin:6px 0 0;padding:0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-s);max-height:min(58vh,420px);overflow:auto}
.results:empty{display:none}

/* two-deck swipe: all-you-can-eat, then the pickup places */
.deckbar{display:flex;align-items:center;gap:3px;padding:3px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.deckbar button{appearance:none;flex:1;border:1px solid transparent;background:transparent;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2);padding:8px 6px;border-radius:var(--r-s);cursor:pointer}
.deckbar button[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.swipehint{font-size:11px;color:var(--ink-3);text-align:center;letter-spacing:.03em}
@media (hover:hover) and (pointer:fine){.swipehint{display:none}}
/* One pane per screen. The deck must be flush: with padding on a scroll container the
   panes are sized to the content box while the viewport includes the padding, so the
   next pane shows through at the edge. */
.deck{display:flex;gap:0;min-width:0;max-width:100%;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;width:100%;min-width:0;max-width:100%;
  scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;gap:12px}
.pane.off{max-height:100vh;overflow:hidden}

.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 10px;border-bottom:1px solid var(--line)}
@media (min-width:520px){.tabs{grid-template-columns:repeat(4,1fr)}}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  padding:9px 3px 8px;line-height:1.1;box-shadow:inset 0 -2px 0 transparent}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
@media (hover:hover){.tab:hover{color:var(--ink)}}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.menu{display:flex;flex-direction:column;gap:12px}
.hallhead{padding-top:2px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hallhead h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;margin:0;
  text-transform:uppercase;letter-spacing:.02em;line-height:1}
.daypick{appearance:none;font:inherit;font-size:12px;padding:5px 9px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--card);color:var(--ink-2)}

/* station groups */
.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.meal > header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding:11px 14px;border-bottom:1px solid var(--line-soft);background:var(--card-2)}
.meal h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;margin:0;
  text-transform:uppercase;letter-spacing:.05em}
.meal h3 small{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:11px;
  letter-spacing:0;text-transform:none;color:var(--ink-3);margin-left:6px}
.plate{border-color:var(--accent)}
.plate > header{align-items:center;background:var(--accent-soft)}
.plate > header > div{min-width:0}
.plate h3 small{display:block;margin:3px 0 0;line-height:1.35}
.mealkcal{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;line-height:1;
  text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mealkcal small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.plateacts{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 14px;border-top:1px solid var(--line-soft)}
.plateacts .ghost{border-color:transparent;padding-left:0}
.stationrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  padding:12px 14px 3px;border-top:1px solid var(--line-soft)}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{border-top:1px solid var(--line-soft)}
.stationrow + ul.items li:first-child{border-top:0}
.row{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:10px 14px;background:transparent;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.row:active{background:var(--card-2)}
@media (hover:hover){.row:hover{background:var(--card-2)}}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nm{font-size:14.5px;line-height:1.28}
.sub2{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.kc{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;
  font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;text-align:right}
.kc em{display:block;font-style:normal;font-size:10px;color:var(--ink-3);
  font-family:"IBM Plex Sans",sans-serif;font-weight:400}
.plus{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;
  color:var(--accent);width:28px;height:28px;display:grid;place-items:center;line-height:1;
  border:1px solid var(--line);border-radius:var(--r-s)}
.bpill{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:var(--r-xs);padding:0 4px;margin-left:5px}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(10,16,22,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:max(28px,env(safe-area-inset-top)) 0 0;overflow:auto;z-index:20;overscroll-behavior:contain}
html:has(.sheet:not([hidden])){overflow:hidden}
.sheet[hidden]{display:none}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;
  width:100%;max-width:520px;padding:18px 18px 0;margin-top:auto;
  padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:560px){
  .sheet{padding:40px 16px}
  .card2{border-radius:var(--r);margin:auto}
}
.card2 h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;margin:0 0 2px;
  text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.card2 p.sub{margin:0 0 13px;font-size:12.5px;color:var(--ink-2)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:15px;padding:7px 9px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--card-2);color:var(--ink)}
.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.fld select{width:100%;font:inherit;font-size:15px;padding:7px 9px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--card-2);color:var(--ink)}
.mealsgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mealsgrid label{text-align:center;margin:0}
.mealsgrid input{padding:6px 2px;text-align:center}
.swiperow{display:flex;align-items:center;gap:8px;margin:4px 0 12px;font-size:14px}
.swiperow span{flex:1}
.swiperow .btn{padding:4px 12px}
.askbar{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:4;
  max-width:568px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);
  padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.askbar[hidden]{display:none}
.askbar span{flex:1 1 180px}
.askbar .btn{padding:6px 12px}
.diets{display:flex;flex-wrap:wrap;gap:6px}
.diets label{display:inline-flex;align-items:center;gap:5px;font-size:13px;text-transform:none;
  letter-spacing:0;color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);
  padding:5px 9px;cursor:pointer;margin:0}
.diets input{width:auto;margin:0}
.btns{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:14px -18px 0;
  padding:12px 18px 16px;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line-soft)}
.btn{appearance:none;font:inherit;font-size:14px;padding:9px 16px;border-radius:var(--r-s);cursor:pointer;
  border:1px solid var(--ink);background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:transparent}
@media (hover:hover){.btn.ghost:hover{color:var(--ink)}}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.people button{appearance:none;font:inherit;font-size:13px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:var(--r-s)}
.people button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* quantity stepper */
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--r-s);
  overflow:hidden;width:max-content}
.qty button{appearance:none;border:0;background:var(--card-2);color:var(--ink);
  font:inherit;font-size:17px;width:38px;height:34px;cursor:pointer;line-height:1}
.qty span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.servline{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}

/* nutrient table */
.ntab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ntab th{text-align:left;font-family:"Barlow Condensed",sans-serif;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  padding:9px 0 3px;border-bottom:1px solid var(--line)}
.ntab td{padding:3px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.ntab td.v{text-align:right;white-space:nowrap;font-weight:500}
.ntab td.dv{text-align:right;width:54px;color:var(--ink-2);font-size:12.5px}
.ntab tr.major td{font-weight:600}
.est{color:var(--accent);font-size:9.5px;vertical-align:super;margin-left:2px}
.dvbar{height:3px;background:var(--line-soft);border-radius:var(--r-s);overflow:hidden;margin-top:2px}
.dvbar i{display:block;height:100%;background:var(--blue)}
.dvbar i.over{background:var(--flag)}
.legend{font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.45}

/* components */
.comp{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.comp .ck{width:20px;height:20px;accent-color:var(--blue)}
.comp .n2{font-size:11px;color:var(--ink-3)}
.grp{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 0 2px}

/* log */
.logrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.logrow .x{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-3);
  font:inherit;font-size:13px;width:28px;height:28px;border-radius:var(--r-s);cursor:pointer}
.empty{font-size:13px;color:var(--ink-3);padding:14px 0}

.vstat{font-size:11.5px;color:var(--flag);border:1px solid var(--flag);border-radius:var(--r-xs);
  padding:1px 6px;white-space:nowrap}
.vstat.on{color:var(--ok);border-color:var(--ok)}
.nowpill{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--card);
  background:var(--blue);border-radius:var(--r-xs);padding:1px 5px;margin-left:6px;vertical-align:2px}
.skipbtn{appearance:none;font:inherit;font-size:13px;margin:0 6px 6px 0;padding:6px 10px;
  border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:var(--r-s);cursor:pointer}
.skipbtn.on{background:var(--blue);border-color:var(--blue);color:var(--card)}
.skipbtn span{opacity:.65;font-size:11.5px;margin-left:3px}
.offdiet{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:0 4px;margin-left:5px;white-space:nowrap}
.warnline{display:block;margin-top:6px;color:var(--flag);font-size:12px;line-height:1.4}
.vnote{margin:0;font-size:12.5px;color:var(--ink-2)}

/* gap recommender */
.gaps{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--shadow)}
.gaps h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;margin:0 0 6px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.gaps .short{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.gaps .short span{font-size:11.5px;background:var(--accent-soft);border-radius:var(--r-s);padding:3px 8px;
  color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.gaps p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45}
.gaps p b{color:var(--ink);font-weight:600}
.gaps .go,.menu .go{appearance:none;font:inherit;font-size:13px;font-weight:600;margin-top:8px;padding:6px 0;
  border:0;background:transparent;color:var(--accent);cursor:pointer;text-align:left}
.gaps .go::after,.menu .go::after{content:" \2192"}
.menu .go{align-self:center}
@media (hover:hover){.gaps .go:hover,.menu .go:hover{text-decoration:underline}}
.badge{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
  border:1px solid var(--accent);border-radius:var(--r-xs);padding:0 4px;margin-left:5px;white-space:nowrap}

/* sticky tally */
.bar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));height:3px;background:rgba(255,255,255,.16);z-index:3}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
.bar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.total{position:fixed;left:0;right:0;bottom:0;background:var(--tally);color:var(--tally-ink);z-index:3;
  border:0;border-top:1px solid var(--line);width:100%;text-align:left;font:inherit;cursor:pointer;display:block}
.total .inner{max-width:600px;margin:0 auto;
  padding:9px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:2px 12px}
.total .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:29px;line-height:1;
  font-variant-numeric:tabular-nums}
.total .big small{font-size:11.5px;font-weight:600;letter-spacing:.08em;opacity:.6;margin-left:5px}
.tallylbl{flex-basis:100%;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.macros{display:flex;gap:11px;font-variant-numeric:tabular-nums}
.macros div{text-align:right}
.macros .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;line-height:1}
.macros .l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;opacity:.6;margin-top:2px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="head">
    <h1>Bruin <span>Swipe</span> Card</h1>
    <button class="who" id="who" type="button">…</button>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" placeholder="Search every dining item…"
           aria-label="Search food">
    <ul class="results" id="results"></ul>
  </div>

  <div class="gaps" id="gaps" hidden></div>

  <div class="deckbar" role="tablist" aria-label="Kind of place">
    <button type="button" role="tab" id="deck0">All you can eat</button>
    <button type="button" role="tab" id="deck1">Pickup, trucks &amp; to go</button>
  </div>
  <div class="swipehint">swipe sideways to switch</div>

  <div class="deck" id="deck">
    <section class="pane" id="pane0">
      <div class="tabs" role="tablist" aria-label="Dining hall"></div>
      <div class="hallhead"><h2></h2><select class="daypick" aria-label="Day"></select></div>
      <div class="menu"></div>
    </section>
    <section class="pane" id="pane1">
      <div class="tabs" role="tablist" aria-label="Pickup place"></div>
      <div class="hallhead"><h2></h2><select class="daypick" aria-label="Day"></select></div>
      <div class="menu"></div>
    </section>
  </div>
</div>

<!-- item / builder sheet -->
<div class="sheet" id="itemSheet" hidden>
  <div class="card2" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <h2 id="itemTitle"></h2>

<script>

/* ------------------------------------------------------------------ constants */

// The allowlist diet and the personal target rules are one person's, not everyone's.

// Daily Values. Change the string to hand it to someone else.
var OWNER = "ryanbuntzen";
var OWNER_DIETS = ["animalfruit"];

// FDA Daily Values (2016 label rules), adult.  Calories come from the profile instead.

  protein:50, fat:78, satfat:20, transfat:null, chol:300, sodium:2300, carb:275,

var LABEL = {
  kcal:"Calories", protein:"Protein", fat:"Total fat", satfat:"Saturated", transfat:"Trans",
  chol:"Cholesterol", sodium:"Sodium", carb:"Carbohydrate", fiber:"Fiber", sugar:"Sugars",

   allow:/\b(egg|eggs|omelet|omelette|beef|steak|tri.?tip|sirloin|brisket|burger|cheeseburger|hamburger|patty|meatball|lamb|pork|bacon|ham|sausage|carnitas|chorizo|riblet|pastrami|prosciutto|gyudon|carne|barbacoa|pastor|chicken|turkey|fish|salmon|tuna|shrimp|cod|tilapia|halibut|katsu|milk|cheese|yogurt|yoghurt|cottage|butter|cream|fruit|apple|banana|orange|grape|melon|cantaloupe|watermelon|pineapple|mango|kiwi|berry|berries|strawberr\w*|blueberr\w*|raspberr\w*|blackberr\w*|peach|pear|plum|cherry|papaya|guava|carrot|rice|sweet potato|yam|honey|sourdough|coconut|smoothie|calamari|squid)\b/i,

   owner:true,
